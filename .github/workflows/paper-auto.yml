name: FTSE Paper Automation

# Independent daily automated paper-fund pass + owned-stock surveillance.
# Scheduling lives in automation-orchestrator.yml (weekdays ~08:17 UTC).
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force act even before settle (testing)"
        type: boolean
        default: false
      surveillance_only:
        description: "Surveillance only (no rebalance)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ftse-paper-automation
  cancel-in-progress: false

jobs:
  paper-auto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Seed paper automation state from dashboard data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from value_investor.paper_auto_publish import seed_paper_auto_state

          copied = seed_paper_auto_state(
              Path("docs/data/paper_automation"),
              Path("output/paper_automation"),
          )
          print(f"Seeded {len(copied)} paper-auto json file(s)")
          PY

      - name: Ensure calibrated AI-judgment shadow tracks
        run: |
          # Idempotent: keep existing competing shadows; create rank-1 if priors exist.
          ftse-knob-calibrate spawn-shadow --paper-root output/paper_automation --top-n 3 || true

      - name: Refresh research overlay on dashboard reports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from value_investor.research.overlay_refresh import refresh_paper_auto_reports

          path = refresh_paper_auto_reports(
              bundle_path=Path("docs/data/latest.json"),
              output_dir=Path("output"),
          )
          print(f"Refreshed research overlay for paper-auto: {path}")
          PY

      - name: Run paper automation (AI judgment primary + rules control + momentum grace)
        env:
          FORCE_RUN: ${{ github.event.inputs.force }}
          SURVEILLANCE_ONLY: ${{ github.event.inputs.surveillance_only }}
        run: |
          ARGS=(--output-dir output/paper_automation --reports docs/data/latest.json --tracks all)
          if [ "${FORCE_RUN:-}" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ "${SURVEILLANCE_ONLY:-}" = "true" ]; then
            ARGS+=(--surveillance-only)
          fi
          ftse-paper-auto "${ARGS[@]}"

      - name: Decision-review learning (both tracks vs market)
        if: ${{ github.event.inputs.surveillance_only != 'true' }}
        run: |
          # Propose always; apply only when enough equity marks/trades exist.
          ftse-decision-review --output-dir output/paper_automation --tracks all --apply

      - name: Refresh calibrated-shadow endurance ledger
        if: ${{ github.event.inputs.surveillance_only != 'true' }}
        run: |
          ftse-knob-calibrate endurance --paper-root output/paper_automation || true

      - name: Publish automation artifacts to dashboard data
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          src = Path("output/paper_automation")
          dest = Path("docs/data/paper_automation")
          dest.mkdir(parents=True, exist_ok=True)
          (dest / "ai_judgment").mkdir(parents=True, exist_ok=True)
          (dest / "momentum_grace").mkdir(parents=True, exist_ok=True)

          root_names = (
              "last_run.json",
              "automated_fund.json",
              "config.json",
              "owned_watchlist.json",
              "decision_review.json",
              "decision_review_history.json",
              "rebalance_log.json",
              "exit_shadow.json",
              "exit_shadow_review.json",
              "learning_tracks_summary.json",
              "learning_tracks_review.json",
              "learning_tracks_exit_shadow.json",
              "learning_tracks_churn_health.json",
              "buffered_hold_counterfactual.json",
              "review_policy.json",
              "knob_calibration_priors.json",
              "calibration_shadow_endurance.json",
          )
          for name in root_names:
              path = src / name
              if path.exists():
                  shutil.copy2(path, dest / name)

          track_file_names = (
              "last_run.json",
              "automated_fund.json",
              "config.json",
              "decision_review.json",
              "decision_review_history.json",
              "rebalance_log.json",
              "exit_shadow.json",
              "exit_shadow_review.json",
              "calibration_provenance.json",
          )

          for name in track_file_names:
              path = src / "ai_judgment" / name
              if path.exists():
                  shutil.copy2(path, dest / "ai_judgment" / name)

          for shadow_dir in sorted(src.glob("ai_judgment_calibrated*")):
              if not shadow_dir.is_dir():
                  continue
              out = dest / shadow_dir.name
              out.mkdir(parents=True, exist_ok=True)
              for name in track_file_names:
                  path = shadow_dir / name
                  if path.exists():
                      shutil.copy2(path, out / name)

          for name in (
              "last_run.json",
              "automated_fund.json",
              "config.json",
              "decision_review.json",
              "decision_review_history.json",
              "rebalance_log.json",
              "exit_shadow.json",
              "exit_shadow_review.json",
          ):
              path = src / "momentum_grace" / name
              if path.exists():
                  shutil.copy2(path, dest / "momentum_grace" / name)

          latest = Path("docs/data/latest.json")
          report = src / "ai_judgment" / "last_run.json"
          if not report.exists():
              report = src / "last_run.json"
          if latest.exists() and report.exists():
              bundle = json.loads(latest.read_text(encoding="utf-8"))
              bundle["paper_automation"] = json.loads(report.read_text(encoding="utf-8"))
              fund = src / "ai_judgment" / "automated_fund.json"
              if not fund.exists():
                  fund = src / "automated_fund.json"
              if fund.exists():
                  bundle["paper_automation"]["fund_snapshot"] = json.loads(fund.read_text(encoding="utf-8"))
              summary = src / "learning_tracks_review.json"
              if summary.exists():
                  bundle["paper_automation"]["learning_tracks_review"] = json.loads(
                      summary.read_text(encoding="utf-8")
                  )
              # Keep Automation tab in sync when present.
              try:
                  from value_investor.automation_status import build_automation_status
                  bundle["automation"] = build_automation_status()
                  Path("docs/data/automation.json").write_text(
                      json.dumps(bundle["automation"], indent=2) + "\n", encoding="utf-8"
                  )
              except Exception as exc:  # noqa: BLE001
                  print(f"automation status refresh skipped: {exc}")
              latest.write_text(json.dumps(bundle), encoding="utf-8")
          from value_investor.paper_auto_publish import publish_overlay_artifacts

          overlay = publish_overlay_artifacts(src, dest)
          print(
              "Published paper automation (+ AI judgment track) artifacts; "
              f"overlays={len(overlay)}"
          )
          PY

      - name: Refresh unified experiment assessment ledger
        if: ${{ github.event.inputs.surveillance_only != 'true' }}
        run: |
          ftse-experiment-assess refresh \
            --data-dir docs/data \
            --paper-root docs/data/paper_automation \
            --sync-task-status || true

      - name: Sync main before commit
        run: git pull --rebase --autostash origin main

      - name: Commit automation artifacts
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: daily paper automation [skip ci]"
          file_pattern: docs/data/**
          skip_fetch: false
