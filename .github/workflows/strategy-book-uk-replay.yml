name: Strategy book UK replay

# Plan step 3.3. Dispatch only. The runner refuses EODHD until the registration
# seal is committed. See docs/ops/strategy-book-uk-replay-runbook.md
on:
  workflow_dispatch:
    inputs:
      phase:
        description: fetch, development, development-amendment, or reveal
        required: true
        type: choice
        options:
          - fetch
          - development
          - development-amendment
          - reveal
      registration:
        description: v0 (sealed 2026-11-12) or v1 (Companies House shares for the cap; refuses until sealed)
        required: true
        default: v0
        type: choice
        options:
          - v0
          - v1

permissions:
  contents: write

concurrency:
  group: ftse-strategy-book-uk-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    # The LSE fetch is ~26.7k requests at <=5/s; the runner stops itself at
    # UK_REPLAY_MAX_MINUTES so the cache is saved before this limit.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: bash scripts/gha_pip_install.sh -e .

      - name: Check EODHD token
        id: secrets
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EODHD_API_TOKEN:-}" ]; then
            echo "Soft-skip: EODHD_API_TOKEN missing — UK replay not run; nothing committed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Restore encrypted resume cache
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/uk-replay-cache.tar.enc
          key: strategy-book-uk-replay-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            strategy-book-uk-replay-

      # Licensed EODHD data: the cache is readable by fork-PR workflows in a public
      # repo, so it is only ever stored encrypted with a secret forks never receive.
      - name: Decrypt resume cache
        if: steps.secrets.outputs.ready == 'true'
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          CACHE_DIR: ${{ runner.temp }}/uk-replay-cache
          CACHE_FILE: ${{ runner.temp }}/uk-replay-cache.tar.enc
        run: |
          set -euo pipefail
          mkdir -p "$CACHE_DIR"
          if [ -f "$CACHE_FILE" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:EODHD_API_TOKEN \
              -in "$CACHE_FILE" | tar -xzf - -C "$CACHE_DIR"
            rm -f "$CACHE_FILE"
          fi

      - name: Run UK replay
        if: steps.secrets.outputs.ready == 'true'
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          UK_REPLAY_CACHE: ${{ runner.temp }}/uk-replay-cache
          UK_REPLAY_MAX_MINUTES: "320"
          PHASE: ${{ inputs.phase }}
          REGISTRATION: ${{ inputs.registration }}
        run: |
          set -euo pipefail
          case "$PHASE" in
            development) set -- develop ;;
            development-amendment) set -- develop --amend ;;
            *) set -- "$PHASE" ;;
          esac
          ftse-strategy-book-uk-replay --registration "$REGISTRATION" "$@" --cache "$UK_REPLAY_CACHE"

      - name: Encrypt resume cache
        if: always() && steps.secrets.outputs.ready == 'true'
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          CACHE_DIR: ${{ runner.temp }}/uk-replay-cache
          CACHE_FILE: ${{ runner.temp }}/uk-replay-cache.tar.enc
        run: |
          set -euo pipefail
          mkdir -p "$CACHE_DIR"
          plain="$RUNNER_TEMP/uk-replay-cache.tgz"
          # GNU tar exits 1 when a file changed while it was read (a cancelled
          # run still writing). The runner writes atomically, so that is safe.
          rc=0
          tar -czf "$plain" -C "$CACHE_DIR" . || rc=$?
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:EODHD_API_TOKEN \
            -in "$plain" -out "$CACHE_FILE"
          rm -rf "$CACHE_DIR" "$plain"

      - name: Save encrypted resume cache
        if: always() && steps.secrets.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/uk-replay-cache.tar.enc
          key: strategy-book-uk-replay-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit aggregate store
        if: steps.secrets.outputs.ready == 'true'
        env:
          GHA_COMMIT_OWNED: docs/data/strategy_book_uk_replay.json docs/data/strategy_book_uk_replay_v1.json
          COMMIT_MESSAGE: "chore: strategy-book UK replay aggregates [skip ci]"
          GHA_COMMIT_LABEL: "strategy-book UK replay"
        run: bash scripts/gha_commit_artifacts.sh
