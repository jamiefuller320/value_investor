name: FTSE Ingest Loop

# Weekday ingest-assess-improve loop for live FTSE buy-tier filing coverage.
# Runs bounded ingest-improvement against docs/data/latest.json (no full screen),
# logs ingest_health, and micro-compiles ingest engineering tasks when coverage stalls.
#
# Reliability: GitHub schedule is best-effort — use external cron → workflow_dispatch
# (see docs/ops/orchestrator-cron.md). Primary + catch-up schedules skip when this
# workflow already succeeded today (or another run is still active).
on:
  schedule:
    - cron: "0 7 * * 1,3,5"
    - cron: "0 10 * * 1,3,5"
  workflow_dispatch:
    inputs:
      max_targets:
        description: "Max buy-tier tickers for ingest-improvement pass"
        type: string
        default: "15"
      force:
        description: "Re-run even if ingest loop already succeeded today"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ftse-ingest-loop
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Skip if ingest loop already ran today
        id: gate
        uses: actions/github-script@v8
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        with:
          script: |
            const force = process.env.FORCE === 'true';
            if (force) {
              core.info('force=true — running ingest loop');
              core.setOutput('should_run', 'true');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'ingest-loop.yml';
            const runId = context.runId;

            function startOfUtcDay(d = new Date()) {
              return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())).toISOString();
            }

            const dayStart = startOfUtcDay();
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id,
              per_page: 30,
            });

            const prior = (data.workflow_runs || []).filter((r) =>
              r.id !== runId
              && r.created_at >= dayStart
              && (r.event === 'workflow_dispatch' || r.event === 'schedule')
            );

            const succeeded = prior.find((r) => r.conclusion === 'success');
            if (succeeded) {
              core.info(
                `Skipping — ingest loop already succeeded today (run ${succeeded.id} at ${succeeded.created_at})`
              );
              core.setOutput('should_run', 'false');
              return;
            }

            const active = prior.find((r) =>
              ['in_progress', 'queued', 'waiting', 'pending'].includes(r.status)
            );
            if (active) {
              core.info(
                `Skipping — ingest loop already active today (run ${active.id}, status=${active.status})`
              );
              core.setOutput('should_run', 'false');
              return;
            }

            core.info('No successful ingest loop today — running');
            core.setOutput('should_run', 'true');

  ingest-loop:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system deps (CH accounts OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install package
        run: pip install -e .

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run weekday ingest loop
        id: loop
        timeout-minutes: 75
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          ARGS=(run --json --json-path /tmp/ingest_loop.json)
          if [ -n "${{ github.event.inputs.max_targets }}" ]; then
            ARGS+=(--max-targets "${{ github.event.inputs.max_targets }}")
          fi
          EXIT=0
          ftse-ingest-loop "${ARGS[@]}" || EXIT=$?
          if [ ! -s /tmp/ingest_loop.json ]; then
            echo "ftse-ingest-loop produced no JSON at /tmp/ingest_loop.json (exit=$EXIT)" >&2
            exit "${EXIT:-1}"
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/ingest_loop.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"micro_compiled={'true' if data.get('micro_compiled') else 'false'}\n",
              encoding="utf-8",
          )
          partial = data.get("partial") or (
              (data.get("ingest_summary") or {}).get("runtime_cutoff")
          )
          if partial:
              print("Ingest loop partial run — committing artifacts from completed targets")
          if data.get("error"):
              print(f"Ingest loop reported error: {data['error']}", flush=True)
          PY
          if [ "$EXIT" -ne 0 ]; then
            PARTIAL=$(python3 -c "import json; d=json.load(open('/tmp/ingest_loop.json')); print('yes' if d.get('partial') or (d.get('ingest_summary') or {}).get('runtime_cutoff') else 'no')")
            if [ "$PARTIAL" = "yes" ]; then
              echo "Partial ingest run — continuing to commit artifacts despite exit $EXIT"
            else
              exit "$EXIT"
            fi
          fi

      - name: Sync main before ingest loop commit
        run: git pull --rebase --autostash origin main

      - name: Commit ingest loop artifacts
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: main
          commit_message: "chore: weekday ingest loop [skip ci]"
          file_pattern: |
            docs/data/ingest_health_log.json
            docs/data/ingest_improvement_summary.json
            docs/data/ingest_bootstrap_summary.json
            docs/data/research/**
            docs/data/engineering_tasks.json
          skip_fetch: false

      - name: Dispatch engineering queue when tasks were added
        if: steps.loop.outputs.micro_compiled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run engineering-queue.yml
          echo "Dispatched engineering-queue after micro-compile"
