name: FTSE Ingest Loop

# Weekday ingest-assess-improve loop for live FTSE buy-tier filing coverage.
# Runs bounded ingest-improvement against docs/data/latest.json (no full screen),
# logs ingest_health, and micro-compiles ingest engineering tasks when coverage stalls.
#
# Reliability: GitHub schedule is best-effort — use external cron → workflow_dispatch
# (see docs/ops/orchestrator-cron.md). Two batches per ingest day (morning +
# afternoon); gate allows up to two successful runs per UTC day.
# Volume plan: docs/ops/market-scrutiny.md
on:
  schedule:
    - cron: "5 7 * * 1-5"
    - cron: "5 10 * * 1-5"
  workflow_dispatch:
    inputs:
      max_targets:
        description: "Max buy-tier tickers for ingest-improvement pass"
        type: string
        default: "12"
      max_runtime_seconds:
        description: "Python runtime budget for ingest-improvement (seconds)"
        type: string
        default: "2100"
      max_bodies:
        description: "Max bodies to refetch per ticker (backfill bursts: 40)"
        type: string
        default: "20"
      bootstrap_seed_cap:
        description: "Canonical index seeds per run (0 = body-drain only)"
        type: string
        default: ""
      force:
        description: "Re-run even if ingest loop already succeeded today"
        type: boolean
        default: false
      record_gap_closure:
        description: "Record run in ingest_gap_closure_runs.json for horizon/analysis review"
        type: boolean
        default: false
      record_trial:
        description: "Deprecated alias for record_gap_closure"
        type: boolean
        default: false
      pin_ticker:
        description: "Pin ingest-improvement to one buy-tier ticker (gap-closure reruns)"
        type: string
        default: ""
      gap_closure_parent_id:
        description: "Parent gap-closure run id when recording a verification rerun"
        type: string
        default: ""
      trial_parent_id:
        description: "Deprecated alias for gap_closure_parent_id"
        type: string
        default: ""
      gap_closure_trigger:
        description: "Orchestration trigger (weekly_followup, eng_idle, verification_rerun, manual)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: ftse-ingest-loop
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Skip when daily ingest batches are complete
        id: gate
        uses: actions/github-script@v8
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
          MAX_DAILY_SUCCESSES: "2"
        with:
          script: |
            const force = process.env.FORCE === 'true';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'ingest-loop.yml';
            const runId = context.runId;

            const { data: allRuns } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id,
              per_page: 30,
            });

            const active = (allRuns.workflow_runs || []).find((r) =>
              r.id !== runId
              && ['in_progress', 'queued', 'waiting', 'pending'].includes(r.status)
            );
            if (active) {
              core.info(
                `Skipping — ingest loop run ${active.id} already ${active.status} (force does not bypass single-flight)`
              );
              core.setOutput('should_run', 'false');
              return;
            }

            if (force) {
              core.info('force=true — running ingest loop (daily success cap bypassed)');
              core.setOutput('should_run', 'true');
              return;
            }

            const maxDaily = parseInt(process.env.MAX_DAILY_SUCCESSES || '2', 10);

            function startOfUtcDay(d = new Date()) {
              return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())).toISOString();
            }

            const dayStart = startOfUtcDay();
            const prior = (allRuns.workflow_runs || []).filter((r) =>
              r.id !== runId
              && r.created_at >= dayStart
              && (r.event === 'workflow_dispatch' || r.event === 'schedule')
            );

            const successes = prior.filter((r) => r.conclusion === 'success');
            if (successes.length >= maxDaily) {
              const ids = successes.slice(0, maxDaily).map((r) => r.id).join(', ');
              core.info(
                `Skipping — ingest loop already succeeded ${successes.length} time(s) today (runs: ${ids})`
              );
              core.setOutput('should_run', 'false');
              return;
            }

            core.info(
              `Ingest loop slot open (${successes.length}/${maxDaily} successes today) — running`
            );
            core.setOutput('should_run', 'true');

  ingest-loop:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system deps (CH accounts OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install package
        run: pip install -e .

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run weekday ingest loop
        id: loop
        timeout-minutes: 40
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          ARGS=(run --json --json-path /tmp/ingest_loop.json)
          if [ -n "${{ github.event.inputs.max_targets }}" ]; then
            ARGS+=(--max-targets "${{ github.event.inputs.max_targets }}")
          fi
          RUNTIME="${{ github.event.inputs.max_runtime_seconds }}"
          if [ -z "$RUNTIME" ]; then
            RUNTIME="2100"
          fi
          ARGS+=(--max-runtime-seconds "$RUNTIME")
          BODIES="${{ github.event.inputs.max_bodies }}"
          if [ -n "$BODIES" ]; then
            ARGS+=(--max-bodies "$BODIES")
          fi
          SEED_CAP="${{ github.event.inputs.bootstrap_seed_cap }}"
          if [ -n "$SEED_CAP" ]; then
            ARGS+=(--bootstrap-seed-cap "$SEED_CAP")
          fi
          RECORD_GAP_CLOSURE="${{ github.event.inputs.record_gap_closure }}"
          if [ "$RECORD_GAP_CLOSURE" != "true" ] && [ "${{ github.event.inputs.record_trial }}" = "true" ]; then
            RECORD_GAP_CLOSURE=true
          fi
          PARENT_ID="${{ github.event.inputs.gap_closure_parent_id }}"
          if [ -z "$PARENT_ID" ]; then
            PARENT_ID="${{ github.event.inputs.trial_parent_id }}"
          fi
          TRIGGER="${{ github.event.inputs.gap_closure_trigger }}"
          if [ "$RECORD_GAP_CLOSURE" = "true" ]; then
            ARGS+=(--record-gap-closure)
            if [ -n "$PARENT_ID" ]; then
              ARGS+=(--gap-closure-title "Ingest gap-closure rerun after engineering")
              ARGS+=(--gap-closure-summary "Verification rerun for gap-closure run $PARENT_ID")
              ARGS+=(--gap-closure-parent-id "$PARENT_ID")
              ARGS+=(--gap-closure-trigger verification_rerun)
            else
              ARGS+=(--gap-closure-title "Single-ticker ingest gap-closure pass")
              ARGS+=(--gap-closure-summary "Highest priority_score buy-tier name with outstanding ingest gaps; review for eng-idle orchestration and global ingest policy.")
              if [ -n "$TRIGGER" ]; then
                ARGS+=(--gap-closure-trigger "$TRIGGER")
              fi
            fi
            ARGS+=(--gap-closure-review-trigger horizon_scan)
          fi
          PIN="${{ github.event.inputs.pin_ticker }}"
          if [ -n "$PIN" ]; then
            ARGS+=(--pin-ticker "$PIN")
          fi
          EXIT=0
          ftse-ingest-loop "${ARGS[@]}" || EXIT=$?
          if [ ! -s /tmp/ingest_loop.json ]; then
            echo "ftse-ingest-loop produced no JSON at /tmp/ingest_loop.json (exit=$EXIT)" >&2
            exit "${EXIT:-1}"
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/ingest_loop.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          partial = data.get("partial") or (
              (data.get("ingest_summary") or {}).get("runtime_cutoff")
          )
          ingest_summary = data.get("ingest_summary") or {}
          targets_deferred = int(ingest_summary.get("targets_deferred") or 0)
          chain = partial and targets_deferred > 0
          out.write_text(
              f"micro_compiled={'true' if data.get('micro_compiled') else 'false'}\n"
              f"gap_closure_compiled={'true' if data.get('gap_closure_compiled') or data.get('trial_compiled') else 'false'}\n"
              f"trial_compiled={'true' if data.get('gap_closure_compiled') or data.get('trial_compiled') else 'false'}\n"
              f"recorded_gap_closure={'true' if data.get('recorded_gap_closure') else 'false'}\n"
              f"partial={'true' if partial else 'false'}\n"
              f"chain_dispatch={'true' if chain else 'false'}\n"
              f"targets_deferred={targets_deferred}\n",
              encoding="utf-8",
          )
          if partial:
              print("Ingest loop partial run — committing artifacts from completed targets")
          if data.get("error"):
              print(f"Ingest loop reported error: {data['error']}", flush=True)
          PY
          if [ "$EXIT" -ne 0 ]; then
            PARTIAL=$(python3 -c "import json; d=json.load(open('/tmp/ingest_loop.json')); print('yes' if d.get('partial') or (d.get('ingest_summary') or {}).get('runtime_cutoff') else 'no')")
            if [ "$PARTIAL" = "yes" ]; then
              echo "Partial ingest run — continuing to commit artifacts despite exit $EXIT"
            else
              exit "$EXIT"
            fi
          fi

      - name: Commit and push ingest loop artifacts
        run: "bash scripts/push_ingest_loop_artifacts.sh 'chore: weekday ingest loop [skip ci]'"

      - name: Chain ingest chunk when runtime cutoff deferred targets
        if: >-
          steps.loop.outputs.partial == 'true'
          && steps.loop.outputs.chain_dispatch == 'true'
          && github.event.inputs.force != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEFERRED="${{ steps.loop.outputs.targets_deferred }}"
          if [ -z "$DEFERRED" ] || [ "$DEFERRED" -le 0 ]; then
            echo "No deferred targets — skip chain dispatch"
            exit 0
          fi
          CHUNK="$DEFERRED"
          if [ "$CHUNK" -gt 8 ]; then
            CHUNK=8
          fi
          gh workflow run ingest-loop.yml -f max_targets="$CHUNK" -f max_runtime_seconds=2100
          echo "Dispatched ingest-loop chunk (max_targets=$CHUNK) to drain backlog"

      - name: Evaluate weekly gap-closure follow-up
        id: gap_followup
        if: >-
          steps.loop.outputs.partial != 'true'
          && steps.loop.outputs.recorded_gap_closure != 'true'
        run: |
          python3 - <<'PY' | tee /tmp/gap_followup.json
          import json
          from pathlib import Path
          from value_investor.ingest_gap_closure import evaluate_weekly_gap_closure_followup
          loop = json.loads(Path("/tmp/ingest_loop.json").read_text())
          result = evaluate_weekly_gap_closure_followup(
              health_after=loop.get("health_after") or {},
              was_gap_closure_run=bool(loop.get("recorded_gap_closure")),
          )
          print(json.dumps(result, indent=2))
          PY
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/gap_followup.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"should_dispatch={'true' if data.get('should_dispatch') else 'false'}\n"
              f"pin_ticker={data.get('pin_ticker', '')}\n"
              f"gap_closure_trigger={data.get('trigger', 'weekly_followup')}\n"
              f"gap_followup_reason={data.get('reason', '')}\n",
              encoding="utf-8",
          )
          PY

      - name: Dispatch gap-closure follow-up after weekday batch
        if: steps.gap_followup.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ingest-loop.yml \
            -f max_targets=1 \
            -f max_bodies=40 \
            -f bootstrap_seed_cap=0 \
            -f max_runtime_seconds=2100 \
            -f force=true \
            -f record_gap_closure=true \
            -f pin_ticker="${{ steps.gap_followup.outputs.pin_ticker }}" \
            -f gap_closure_trigger="${{ steps.gap_followup.outputs.gap_closure_trigger }}"
          echo "Dispatched ingest-loop gap-closure follow-up for ${{ steps.gap_followup.outputs.pin_ticker }}"

      - name: Dispatch engineering queue when tasks were added
        if: >-
          steps.loop.outputs.micro_compiled == 'true'
          || steps.loop.outputs.gap_closure_compiled == 'true'
          || steps.loop.outputs.trial_compiled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run engineering-queue.yml
          echo "Dispatched engineering-queue after ingest micro-compile or gap-closure task"
