name: FTSE Ingest Loop

# Weekday ingest-assess-improve loop for live FTSE buy-tier filing coverage.
# Runs bounded ingest-improvement against docs/data/latest.json (no full screen),
# logs ingest_health, and micro-compiles ingest engineering tasks when coverage stalls.
on:
  schedule:
    - cron: "0 7 * * 1,3,5"
  workflow_dispatch:
    inputs:
      max_targets:
        description: "Max buy-tier tickers for ingest-improvement pass"
        type: string
        default: "5"

permissions:
  contents: write
  actions: write

concurrency:
  group: ftse-ingest-loop
  cancel-in-progress: false

jobs:
  ingest-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system deps (CH accounts OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install package
        run: pip install -e .

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run weekday ingest loop
        id: loop
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
        run: |
          ARGS="run --json"
          if [ -n "${{ github.event.inputs.max_targets }}" ]; then
            ARGS="$ARGS --max-targets ${{ github.event.inputs.max_targets }}"
          fi
          ftse-ingest-loop $ARGS | tee /tmp/ingest_loop.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/ingest_loop.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"micro_compiled={'true' if data.get('micro_compiled') else 'false'}\n",
              encoding="utf-8",
          )
          PY

      - name: Sync main before ingest loop commit
        run: git pull --rebase --autostash origin main

      - name: Commit ingest loop artifacts
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: main
          commit_message: "chore: weekday ingest loop [skip ci]"
          file_pattern: |
            docs/data/ingest_health_log.json
            docs/data/ingest_improvement_summary.json
            docs/data/research/**
            docs/data/engineering_tasks.json
          skip_fetch: false

      - name: Dispatch engineering queue when tasks were added
        if: steps.loop.outputs.micro_compiled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run engineering-queue.yml
          echo "Dispatched engineering-queue after micro-compile"
