name: FTSE Ingest Loop

# Weekday ingest-assess-improve loop for live FTSE buy-tier filing coverage.
# Runs bounded ingest-improvement against docs/data/latest.json (no full screen),
# logs ingest_health, and micro-compiles ingest engineering tasks when coverage stalls.
#
# Reliability: GitHub schedule is best-effort — use external cron → workflow_dispatch
# (see docs/ops/orchestrator-cron.md). Two batches per ingest day (morning +
# afternoon); gate allows multiple successes per UTC day during learning phase.
# Learning-phase bar: scan all buy-tier, then deepen toward indexed_without_body≈0
# same day (compute unconstrained). Volume plan: docs/ops/market-scrutiny.md
on:
  schedule:
    - cron: "5 7 * * 1-5"
    - cron: "5 10 * * 1-5"
  workflow_dispatch:
    inputs:
      max_targets:
        description: "Max buy-tier tickers for ingest-improvement pass"
        type: string
        default: "62"
      max_runtime_seconds:
        description: "Python runtime budget for ingest-improvement (seconds)"
        type: string
        default: "3600"
      max_bodies:
        description: "Max bodies to refetch per ticker (backfill bursts: 40)"
        type: string
        default: "40"
      bootstrap_seed_cap:
        description: "Canonical index seeds per run (0 = body-drain only)"
        type: string
        default: ""
      force:
        description: "Re-run even if ingest loop already succeeded today"
        type: boolean
        default: false
      drain_generation:
        description: "Body-gap drain generation (0=root; follow-ups increment; stops at max)"
        type: string
        default: "0"
      max_drain_generations:
        description: "Max auto body-gap drain follow-ups while indexed_without_body>0"
        type: string
        default: "12"
      body_gap_chain:
        description: "Deprecated; use drain_generation>=1"
        type: boolean
        default: false
      record_gap_closure:
        description: "Record run in ingest_gap_closure_runs.json for horizon/analysis review"
        type: boolean
        default: false
      record_trial:
        description: "Deprecated alias for record_gap_closure"
        type: boolean
        default: false
      pin_ticker:
        description: "Pin ingest-improvement to one buy-tier ticker (gap-closure reruns)"
        type: string
        default: ""
      gap_closure_parent_id:
        description: "Parent gap-closure run id when recording a verification rerun"
        type: string
        default: ""
      trial_parent_id:
        description: "Deprecated alias for gap_closure_parent_id"
        type: string
        default: ""
      gap_closure_trigger:
        description: "Orchestration trigger (weekly_followup, eng_idle, verification_rerun, manual)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: ftse-ingest-loop
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Skip when daily ingest batches are complete
        id: gate
        uses: actions/github-script@v8
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
          # Learning phase: allow morning + afternoon + body-gap chains
          MAX_DAILY_SUCCESSES: "8"
        with:
          script: |
            const force = process.env.FORCE === 'true';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'ingest-loop.yml';
            const runId = context.runId;

            const { data: allRuns } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id,
              per_page: 30,
            });

            const active = (allRuns.workflow_runs || []).find((r) =>
              r.id !== runId
              && ['in_progress', 'queued', 'waiting', 'pending'].includes(r.status)
            );
            if (active) {
              core.info(
                `Skipping — ingest loop run ${active.id} already ${active.status} (force does not bypass single-flight)`
              );
              core.setOutput('should_run', 'false');
              return;
            }

            if (force) {
              core.info('force=true — running ingest loop (daily success cap bypassed)');
              core.setOutput('should_run', 'true');
              return;
            }

            const maxDaily = parseInt(process.env.MAX_DAILY_SUCCESSES || '2', 10);

            function startOfUtcDay(d = new Date()) {
              return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())).toISOString();
            }

            const dayStart = startOfUtcDay();
            const prior = (allRuns.workflow_runs || []).filter((r) =>
              r.id !== runId
              && r.created_at >= dayStart
              && (r.event === 'workflow_dispatch' || r.event === 'schedule')
            );

            const successes = prior.filter((r) => r.conclusion === 'success');
            if (successes.length >= maxDaily) {
              const ids = successes.slice(0, maxDaily).map((r) => r.id).join(', ');
              core.info(
                `Skipping — ingest loop already succeeded ${successes.length} time(s) today (runs: ${ids})`
              );
              core.setOutput('should_run', 'false');
              return;
            }

            core.info(
              `Ingest loop slot open (${successes.length}/${maxDaily} successes today) — running`
            );
            core.setOutput('should_run', 'true');

  ingest-loop:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system deps (CH accounts OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install package
        run: pip install -e .

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run weekday ingest loop
        id: loop
        timeout-minutes: 65
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          PYTHONUNBUFFERED: "1"
          PIN_TICKER: ${{ github.event.inputs.pin_ticker }}
          DRAIN_GENERATION: ${{ github.event.inputs.drain_generation || '0' }}
          MAX_DRAIN_GENERATIONS: ${{ github.event.inputs.max_drain_generations || '12' }}
          BODY_GAP_CHAIN_LEGACY: ${{ github.event.inputs.body_gap_chain || 'false' }}
        run: |
          set -euo pipefail
          ARGS=(run --json --json-path /tmp/ingest_loop.json)
          if [ -n "${{ github.event.inputs.max_targets }}" ]; then
            ARGS+=(--max-targets "${{ github.event.inputs.max_targets }}")
          fi
          RUNTIME="${{ github.event.inputs.max_runtime_seconds }}"
          if [ -z "$RUNTIME" ]; then
            RUNTIME="3600"
          fi
          ARGS+=(--max-runtime-seconds "$RUNTIME")
          BODIES="${{ github.event.inputs.max_bodies }}"
          if [ -n "$BODIES" ]; then
            ARGS+=(--max-bodies "$BODIES")
          fi
          SEED_CAP="${{ github.event.inputs.bootstrap_seed_cap }}"
          if [ -n "$SEED_CAP" ]; then
            ARGS+=(--bootstrap-seed-cap "$SEED_CAP")
          fi
          RECORD_GAP_CLOSURE="${{ github.event.inputs.record_gap_closure }}"
          if [ "$RECORD_GAP_CLOSURE" != "true" ] && [ "${{ github.event.inputs.record_trial }}" = "true" ]; then
            RECORD_GAP_CLOSURE=true
          fi
          PARENT_ID="${{ github.event.inputs.gap_closure_parent_id }}"
          if [ -z "$PARENT_ID" ]; then
            PARENT_ID="${{ github.event.inputs.trial_parent_id }}"
          fi
          TRIGGER="${{ github.event.inputs.gap_closure_trigger }}"
          if [ "$RECORD_GAP_CLOSURE" = "true" ]; then
            ARGS+=(--record-gap-closure)
            if [ -n "$PARENT_ID" ]; then
              ARGS+=(--gap-closure-title "Ingest gap-closure rerun after engineering")
              ARGS+=(--gap-closure-summary "Verification rerun for gap-closure run $PARENT_ID")
              ARGS+=(--gap-closure-parent-id "$PARENT_ID")
              ARGS+=(--gap-closure-trigger verification_rerun)
            else
              ARGS+=(--gap-closure-title "Single-ticker ingest gap-closure pass")
              ARGS+=(--gap-closure-summary "Highest priority_score buy-tier name with outstanding ingest gaps; review for eng-idle orchestration and global ingest policy.")
              if [ -n "$TRIGGER" ]; then
                ARGS+=(--gap-closure-trigger "$TRIGGER")
              fi
            fi
            ARGS+=(--gap-closure-review-trigger horizon_scan)
          fi
          PIN="${{ github.event.inputs.pin_ticker }}"
          if [ -n "$PIN" ]; then
            ARGS+=(--pin-ticker "$PIN")
          fi
          EXIT=0
          ftse-ingest-loop "${ARGS[@]}" || EXIT=$?
          if [ ! -s /tmp/ingest_loop.json ]; then
            echo "ftse-ingest-loop produced no JSON at /tmp/ingest_loop.json (exit=$EXIT)" >&2
            exit "${EXIT:-1}"
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/ingest_loop.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          partial = data.get("partial") or (
              (data.get("ingest_summary") or {}).get("runtime_cutoff")
          )
          ingest_summary = data.get("ingest_summary") or {}
          targets_deferred = int(ingest_summary.get("targets_deferred") or 0)
          chain = partial and targets_deferred > 0
          health_before = data.get("health_before") or {}
          health_after = data.get("health_after") or {}
          indexed_before = int(health_before.get("indexed_without_body") or 0)
          indexed_without_body = int(health_after.get("indexed_without_body") or 0)
          improved = int(
              data.get("ingest_improved")
              if data.get("ingest_improved") is not None
              else (ingest_summary.get("improved") or 0)
          )
          pin = bool(str(os.environ.get("PIN_TICKER") or "").strip())
          recorded_gap = bool(data.get("recorded_gap_closure"))
          try:
              gen = int(str(os.environ.get("DRAIN_GENERATION") or "0").strip() or "0")
          except ValueError:
              gen = 0
          if str(os.environ.get("BODY_GAP_CHAIN_LEGACY") or "").lower() == "true" and gen <= 0:
              gen = 1
          try:
              max_gen = int(str(os.environ.get("MAX_DRAIN_GENERATIONS") or "12").strip() or "12")
          except ValueError:
              max_gen = 12
          progress = indexed_without_body < indexed_before or improved > 0
          # Keep chaining while gaps remain; stop if a follow-up makes no progress
          # (unfetchable residual) or max generations hit.
          stalled = (not progress) and gen >= 1
          body_gap_chain = (
              not partial
              and not pin
              and not recorded_gap
              and indexed_without_body > 0
              and gen < max_gen
              and not stalled
          )
          next_gen = gen + 1
          out.write_text(
              f"micro_compiled={'true' if data.get('micro_compiled') else 'false'}\n"
              f"gap_closure_compiled={'true' if data.get('gap_closure_compiled') or data.get('trial_compiled') else 'false'}\n"
              f"trial_compiled={'true' if data.get('gap_closure_compiled') or data.get('trial_compiled') else 'false'}\n"
              f"recorded_gap_closure={'true' if data.get('recorded_gap_closure') else 'false'}\n"
              f"partial={'true' if partial else 'false'}\n"
              f"chain_dispatch={'true' if chain else 'false'}\n"
              f"targets_deferred={targets_deferred}\n"
              f"indexed_without_body={indexed_without_body}\n"
              f"indexed_before={indexed_before}\n"
              f"drain_generation={gen}\n"
              f"next_drain_generation={next_gen}\n"
              f"body_gap_chain={'true' if body_gap_chain else 'false'}\n"
              f"body_gap_stalled={'true' if stalled else 'false'}\n",
              encoding="utf-8",
          )
          if partial:
              print("Ingest loop partial run — committing artifacts from completed targets")
          if body_gap_chain:
              print(
                  f"Body-gap remain indexed_without_body={indexed_without_body} "
                  f"(was {indexed_before}); chaining drain generation {next_gen}/{max_gen}",
                  flush=True,
              )
          elif indexed_without_body > 0 and stalled:
              print(
                  f"Body-gap drain stalled at indexed_without_body={indexed_without_body} "
                  f"(no progress on generation {gen}) — stopping auto-chain",
                  flush=True,
              )
          elif indexed_without_body == 0:
              print("Buy-tier body gaps cleared (indexed_without_body=0)", flush=True)
          if data.get("error"):
              print(f"Ingest loop reported error: {data['error']}", flush=True)
          PY
          if [ "$EXIT" -ne 0 ]; then
            PARTIAL=$(python3 -c "import json; d=json.load(open('/tmp/ingest_loop.json')); print('yes' if d.get('partial') or (d.get('ingest_summary') or {}).get('runtime_cutoff') else 'no')")
            if [ "$PARTIAL" = "yes" ]; then
              echo "Partial ingest run — continuing to commit artifacts despite exit $EXIT"
            else
              exit "$EXIT"
            fi
          fi

      - name: Commit and push ingest loop artifacts
        run: "bash scripts/push_ingest_loop_artifacts.sh 'chore: weekday ingest loop [skip ci]'"

      # Skip while drain/chunk chains continue so rememo sees the thickened corpus
      # and does not burn weekly_ops mid-queue.
      - name: Weekday rememo when memo bodies improved or grades lag
        id: weekday_rememo
        if: >-
          steps.loop.outputs.chain_dispatch != 'true'
          && steps.loop.outputs.body_gap_chain != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "CURSOR_API_KEY unset — skip weekday rememo"
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          ftse-research --weekday-rememo --weekday-rememo-cap 3 \
            --ingest-loop-json /tmp/ingest_loop.json \
            --skip-screen
          REMEMO_EXIT=$?
          set -e
          if [ "$REMEMO_EXIT" -ne 0 ]; then
            echo "weekday rememo exited $REMEMO_EXIT (continuing; see summary)"
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("docs/data/weekday_memo_rememo_summary.json")
          out = Path(os.environ["GITHUB_OUTPUT"])
          if not path.exists():
              with out.open("a", encoding="utf-8") as handle:
                  handle.write("ran=false\nrememoed=0\n")
              raise SystemExit(0)
          data = json.loads(path.read_text(encoding="utf-8"))
          rememoed = data.get("rememoed") or []
          with out.open("a", encoding="utf-8") as handle:
              handle.write(
                  f"ran=true\n"
                  f"rememoed={len(rememoed)}\n"
                  f"skipped={','.join(data.get('skipped') or [])}\n"
              )
          print(json.dumps(data, indent=2)[:2000])
          PY

      - name: Commit weekday rememo artifacts
        if: steps.weekday_rememo.outputs.ran == 'true' && steps.weekday_rememo.outputs.rememoed != '0'
        run: "bash scripts/push_weekday_rememo_artifacts.sh 'chore: weekday memo rememo [skip ci]'"

      - name: Chain ingest chunk when runtime cutoff deferred targets
        if: >-
          steps.loop.outputs.partial == 'true'
          && steps.loop.outputs.chain_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEFERRED="${{ steps.loop.outputs.targets_deferred }}"
          if [ -z "$DEFERRED" ] || [ "$DEFERRED" -le 0 ]; then
            echo "No deferred targets — skip chain dispatch"
            exit 0
          fi
          CHUNK="$DEFERRED"
          if [ "$CHUNK" -gt 62 ]; then
            CHUNK=62
          fi
          NEXT_GEN="${{ steps.loop.outputs.next_drain_generation }}"
          if [ -z "$NEXT_GEN" ]; then
            NEXT_GEN=1
          fi
          gh workflow run ingest-loop.yml \
            -f max_targets="$CHUNK" \
            -f max_bodies=40 \
            -f max_runtime_seconds=3600 \
            -f force=true \
            -f drain_generation="$NEXT_GEN" \
            -f max_drain_generations="${{ github.event.inputs.max_drain_generations || '12' }}"
          echo "Dispatched ingest-loop chunk (max_targets=$CHUNK, drain_generation=$NEXT_GEN)"

      - name: Chain body-gap drain until caught up
        if: >-
          steps.loop.outputs.body_gap_chain == 'true'
          && github.event.inputs.pin_ticker == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GAPS="${{ steps.loop.outputs.indexed_without_body }}"
          NEXT_GEN="${{ steps.loop.outputs.next_drain_generation }}"
          echo "Buy-tier still has indexed_without_body=$GAPS — chaining drain generation $NEXT_GEN"
          gh workflow run ingest-loop.yml \
            -f max_targets=62 \
            -f max_bodies=40 \
            -f max_runtime_seconds=3600 \
            -f force=true \
            -f drain_generation="$NEXT_GEN" \
            -f max_drain_generations="${{ github.event.inputs.max_drain_generations || '12' }}"
          echo "Dispatched learning-phase body-gap drain generation $NEXT_GEN"

      - name: Evaluate weekly gap-closure follow-up
        id: gap_followup
        if: >-
          steps.loop.outputs.partial != 'true'
          && steps.loop.outputs.recorded_gap_closure != 'true'
        run: |
          python3 - <<'PY' | tee /tmp/gap_followup.json
          import json
          from pathlib import Path
          from value_investor.ingest_gap_closure import evaluate_weekly_gap_closure_followup
          loop = json.loads(Path("/tmp/ingest_loop.json").read_text())
          result = evaluate_weekly_gap_closure_followup(
              health_after=loop.get("health_after") or {},
              was_gap_closure_run=bool(loop.get("recorded_gap_closure")),
          )
          print(json.dumps(result, indent=2))
          PY
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/gap_followup.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"should_dispatch={'true' if data.get('should_dispatch') else 'false'}\n"
              f"pin_ticker={data.get('pin_ticker', '')}\n"
              f"gap_closure_trigger={data.get('trigger', 'weekly_followup')}\n"
              f"gap_followup_reason={data.get('reason', '')}\n",
              encoding="utf-8",
          )
          PY

      - name: Dispatch gap-closure follow-up after weekday batch
        if: steps.gap_followup.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ingest-loop.yml \
            -f max_targets=1 \
            -f max_bodies=40 \
            -f bootstrap_seed_cap=0 \
            -f max_runtime_seconds=2100 \
            -f force=true \
            -f record_gap_closure=true \
            -f pin_ticker="${{ steps.gap_followup.outputs.pin_ticker }}" \
            -f gap_closure_trigger="${{ steps.gap_followup.outputs.gap_closure_trigger }}"
          echo "Dispatched ingest-loop gap-closure follow-up for ${{ steps.gap_followup.outputs.pin_ticker }}"

      - name: Dispatch engineering queue when tasks were added
        if: >-
          steps.loop.outputs.micro_compiled == 'true'
          || steps.loop.outputs.gap_closure_compiled == 'true'
          || steps.loop.outputs.trial_compiled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run engineering-queue.yml
          echo "Dispatched engineering-queue after ingest micro-compile or gap-closure task"

      - name: Evaluate Wednesday anchor email_only
        id: wed_anchor
        if: >-
          steps.loop.outputs.partial != 'true'
          || steps.loop.outputs.chain_dispatch != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ftse-engineering try-wednesday-anchor \
            --ingest-loop-json /tmp/ingest_loop.json \
            --allow-skip --json | tee /tmp/wed_anchor.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/wed_anchor.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as handle:
              handle.write(
                  f"should_dispatch={'true' if data.get('should_dispatch') else 'false'}\n"
                  f"reason={data.get('reason', '')}\n"
              )
          PY

      - name: Chain Wednesday anchor orchestrator
        if: steps.wed_anchor.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ftse-engineering record-accelerated-email \
            --source wednesday_anchor \
            --note "${{ steps.wed_anchor.outputs.reason }}"
          gh workflow run automation-orchestrator.yml \
            -f suite=email_only \
            -f force=true
          echo "Dispatched automation-orchestrator email_only (Wednesday anchor)"

      - name: Sync main before Wednesday anchor log commit
        if: steps.wed_anchor.outputs.should_dispatch == 'true'
        run: git pull --rebase --autostash origin main

      - name: Commit Wednesday anchor log
        if: steps.wed_anchor.outputs.should_dispatch == 'true'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: main
          commit_message: "chore: log Wednesday anchor email_only [skip ci]"
          file_pattern: docs/data/accelerated_review.json
          skip_fetch: false
