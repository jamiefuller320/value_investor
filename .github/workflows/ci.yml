name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/data/**"
      - "docs/research/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + test deps
        run: pip install -e ".[dev]"

      - name: Check committed data JSON integrity
        run: python3 scripts/check_committed_data_json.py

      - name: Ruff (changed Python only)
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push — skipping scoped ruff"
            exit 0
          fi
          python3 scripts/check_changed_python.py --base "${BASE_REF}" --head HEAD

      - name: Pytest
        run: pytest -q

  engineering-path-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Validate engineering PR paths
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "${BASE_REF}"
          git diff --name-only "origin/${BASE_REF}...HEAD" > /tmp/changed_files.txt
          ftse-engineering check-pr-paths \
            --branch "${HEAD_REF}" \
            --changed-files /tmp/changed_files.txt
