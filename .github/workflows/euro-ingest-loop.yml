name: Euro library ingest loop

# Weekday buy-tier filing deepen for euro_depth (and warm-start euro_stoxx50).
# No weekly_ops spend — ESEF + euro_filings + IR allowlist body fetch only.
#
# Completion gate: ftse-library euro-ingest-dispatch throttles or skips when
# Phase 3 is ready and filing parity is met (see euro_depth_ingest_dispatch.py).
on:
  schedule:
    - cron: "15 7 * * 1-5"
    - cron: "15 10 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "Library market id"
        type: string
        default: "euro_depth"
      max_targets:
        description: "Max buy-tier tickers per run"
        type: string
        default: ""
      max_runtime_seconds:
        description: "Runtime budget (seconds)"
        type: string
        default: "2100"
      max_bodies:
        description: "Max bodies to refetch per ticker"
        type: string
        default: "20"
      force:
        description: "Re-run even if already succeeded today or dispatch is idle"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: euro-ingest-loop
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      max_targets: ${{ steps.dispatch.outputs.max_targets }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Evaluate euro ingest completion gate
        id: dispatch
        run: |
          set -euo pipefail
          ftse-library euro-ingest-dispatch --json | tee /tmp/euro_ingest_dispatch.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/euro_ingest_dispatch.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"mode={data.get('mode', '')}\n"
              f"max_daily_successes={data.get('max_daily_successes', 0)}\n"
              f"max_targets={data.get('max_targets', 12)}\n"
              f"should_run_ingest={'true' if data.get('should_run_ingest') else 'false'}\n"
              f"dispatch_reason={data.get('reason', '')}\n",
              encoding="utf-8",
          )
          PY

      - name: Skip when completion gate or daily batches are complete
        id: gate
        uses: actions/github-script@v8
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
          SHOULD_RUN_INGEST: ${{ steps.dispatch.outputs.should_run_ingest }}
          MAX_DAILY_SUCCESSES: ${{ steps.dispatch.outputs.max_daily_successes }}
          DISPATCH_MODE: ${{ steps.dispatch.outputs.mode }}
          DISPATCH_REASON: ${{ steps.dispatch.outputs.dispatch_reason }}
        with:
          script: |
            const force = process.env.FORCE === 'true';
            if (force) {
              core.setOutput('should_run', 'true');
              core.info('force=true — bypassing completion gate');
              return;
            }
            if (process.env.SHOULD_RUN_INGEST !== 'true') {
              core.setOutput('should_run', 'false');
              core.info(
                `Skipping euro ingest: mode=${process.env.DISPATCH_MODE} `
                + `(${process.env.DISPATCH_REASON})`
              );
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'euro-ingest-loop.yml';
            const runId = context.runId;
            const { data: allRuns } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id,
              per_page: 30,
            });
            function startOfUtcDay(d = new Date()) {
              return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())).toISOString();
            }
            const dayStart = startOfUtcDay();
            const prior = (allRuns.workflow_runs || []).filter((r) =>
              r.id !== runId
              && r.created_at >= dayStart
              && (r.event === 'workflow_dispatch' || r.event === 'schedule')
            );
            const successes = prior.filter((r) => r.conclusion === 'success');
            const maxDaily = parseInt(process.env.MAX_DAILY_SUCCESSES || '2', 10);
            if (successes.length >= maxDaily) {
              core.setOutput('should_run', 'false');
              core.info(`Daily cap reached (${successes.length}/${maxDaily})`);
              return;
            }
            core.setOutput('should_run', 'true');

  euro-ingest-loop:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run library ingest loop
        run: |
          set -euo pipefail
          MARKET="${{ github.event.inputs.market || 'euro_depth' }}"
          MAX_TARGETS="${{ github.event.inputs.max_targets || needs.check.outputs.max_targets || '12' }}"
          ARGS=(ingest-loop --market "$MARKET" --json --max-targets "$MAX_TARGETS")
          if [ -n "${{ github.event.inputs.max_runtime_seconds }}" ]; then
            ARGS+=(--max-runtime-seconds "${{ github.event.inputs.max_runtime_seconds }}")
          fi
          if [ -n "${{ github.event.inputs.max_bodies }}" ]; then
            ARGS+=(--max-bodies "${{ github.event.inputs.max_bodies }}")
          fi
          ftse-library "${ARGS[@]}" | tee /tmp/euro_ingest_loop.json

      - name: Refresh completion gate and sync euro crons
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
        run: |
          ftse-library euro-ingest-dispatch --refresh --sync-cron --json | tee /tmp/euro_dispatch_refresh.json

      - name: Commit and push library ingest artifacts
        run: |
          bash scripts/push_library_ingest_artifacts.sh \
            'chore: euro_depth ingest loop [skip ci]'
