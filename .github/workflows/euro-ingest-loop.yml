name: Euro library ingest loop

# Buy-tier filing deepen for euro_depth (and warm-start euro_stoxx50).
# No weekly_ops spend — ESEF + euro_filings + IR allowlist body fetch only.
#
# Cadence: Mon–Sat peak (07:15/10:15) + daily off-peak (13:15/16:15, includes
# Sunday after the quiet bundle). Skips Sunday morning to avoid ladder/email contention.
#
# Completion gate: ftse-library euro-ingest-dispatch throttles sprint when filing
# parity is met (see library_ingest_dispatch.py). Sprint: ≤4×/day × 24 targets.
on:
  schedule:
    - cron: "15 7 * * 1-6"
    - cron: "15 10 * * 1-6"
    - cron: "15 13 * * *"
    - cron: "15 16 * * *"
  workflow_dispatch:
    inputs:
      market:
        description: "Library market id"
        type: string
        default: "euro_depth"
      max_targets:
        description: "Max buy-tier tickers per run"
        type: string
        default: ""
      max_runtime_seconds:
        description: "Runtime budget (seconds)"
        type: string
        default: "2700"
      max_bodies:
        description: "Max bodies to refetch per ticker"
        type: string
        default: "40"
      force:
        description: "Re-run even if already succeeded today or dispatch is idle"
        type: boolean
        default: false
      record_gap_closure:
        description: "Record run in ingest_gap_closure_runs.json for horizon/analysis review"
        type: boolean
        default: false
      record_trial:
        description: "Deprecated alias for record_gap_closure"
        type: boolean
        default: false
      pin_ticker:
        description: "Pin ingest-loop to one buy-tier ticker (gap-closure reruns)"
        type: string
        default: ""
      gap_closure_parent_id:
        description: "Parent gap-closure run id when recording a verification rerun"
        type: string
        default: ""
      gap_closure_trigger:
        description: "Orchestration trigger (weekly_followup, stall_slowdown, eng_idle, verification_rerun, manual)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: euro-ingest-loop
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      max_targets: ${{ steps.dispatch.outputs.max_targets }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: bash scripts/gha_pip_install.sh -e .

      - name: Evaluate euro ingest completion gate
        id: dispatch
        run: |
          set -euo pipefail
          # Prefer --json-path over tee: stdout can include third-party warnings (e.g. fitz)
          # that break json.loads of a teed capture.
          ftse-library euro-ingest-dispatch --json --json-path /tmp/euro_ingest_dispatch.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/euro_ingest_dispatch.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"mode={data.get('mode', '')}\n"
              f"max_daily_successes={data.get('max_daily_successes', 0)}\n"
              f"max_targets={data.get('max_targets', 12)}\n"
              f"should_run_sprint_ingest={'true' if data.get('should_run_sprint_ingest') else 'false'}\n"
              f"should_run_ingest={'true' if data.get('should_run_ingest') else 'false'}\n"
              f"dispatch_reason={data.get('reason', '')}\n",
              encoding="utf-8",
          )
          PY

      - name: Skip when completion gate or daily batches are complete
        id: gate
        uses: actions/github-script@v8
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
          SHOULD_RUN_SPRINT_INGEST: ${{ steps.dispatch.outputs.should_run_sprint_ingest }}
          SHOULD_RUN_INGEST: ${{ steps.dispatch.outputs.should_run_ingest }}
          MAX_DAILY_SUCCESSES: ${{ steps.dispatch.outputs.max_daily_successes }}
          DISPATCH_MODE: ${{ steps.dispatch.outputs.mode }}
          DISPATCH_REASON: ${{ steps.dispatch.outputs.dispatch_reason }}
        with:
          script: |
            const force = process.env.FORCE === 'true';
            if (force) {
              core.setOutput('should_run', 'true');
              core.info('force=true — bypassing completion gate');
              return;
            }
            if (process.env.SHOULD_RUN_SPRINT_INGEST !== 'true' && process.env.SHOULD_RUN_INGEST !== 'true') {
              core.setOutput('should_run', 'false');
              core.info(
                `Skipping euro sprint ingest: mode=${process.env.DISPATCH_MODE} `
                + `(${process.env.DISPATCH_REASON})`
              );
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'euro-ingest-loop.yml';
            const runId = context.runId;
            const { data: allRuns } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id,
              per_page: 30,
            });
            function startOfUtcDay(d = new Date()) {
              return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())).toISOString();
            }
            const dayStart = startOfUtcDay();
            const prior = (allRuns.workflow_runs || []).filter((r) =>
              r.id !== runId
              && r.created_at >= dayStart
              && (r.event === 'workflow_dispatch' || r.event === 'schedule')
            );
            const successes = prior.filter((r) => r.conclusion === 'success');
            const maxDaily = parseInt(process.env.MAX_DAILY_SUCCESSES || '2', 10);
            if (successes.length >= maxDaily) {
              core.setOutput('should_run', 'false');
              core.info(`Daily cap reached (${successes.length}/${maxDaily})`);
              return;
            }
            core.setOutput('should_run', 'true');

  euro-ingest-loop:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # Must exceed Python budget (default 2700s) + setup + last-ticker overrun + commit.
    # Schedule events omit workflow_dispatch defaults; timed-out jobs show as cancelled.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: bash scripts/gha_pip_install.sh -e .

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run library ingest loop
        id: loop
        env:
          MARKET: ${{ github.event.inputs.market || 'euro_depth' }}
          MAX_TARGETS: ${{ github.event.inputs.max_targets || needs.check.outputs.max_targets || '12' }}
          MAX_RUNTIME_SECONDS: ${{ github.event.inputs.max_runtime_seconds }}
          MAX_BODIES: ${{ github.event.inputs.max_bodies }}
          RECORD_GAP_CLOSURE_INPUT: ${{ github.event.inputs.record_gap_closure }}
          RECORD_TRIAL: ${{ github.event.inputs.record_trial }}
          GAP_CLOSURE_PARENT_ID: ${{ github.event.inputs.gap_closure_parent_id }}
          GAP_CLOSURE_TRIGGER: ${{ github.event.inputs.gap_closure_trigger }}
          PIN_TICKER: ${{ github.event.inputs.pin_ticker }}
        run: |
          set -euo pipefail
          require_safe() {
            local name="$1" val="$2" re="$3"
            if [ -n "$val" ] && ! [[ "$val" =~ $re ]]; then
              echo "Rejecting unsafe dispatch input: $name" >&2
              exit 1
            fi
          }
          require_safe market "${MARKET:-}" '^[a-z][a-z0-9_]{0,63}$'
          require_safe max_targets "${MAX_TARGETS:-}" '^[0-9]+$'
          require_safe max_runtime_seconds "${MAX_RUNTIME_SECONDS:-}" '^[0-9]+$'
          require_safe max_bodies "${MAX_BODIES:-}" '^[0-9]+$'
          require_safe pin_ticker "${PIN_TICKER:-}" '^[A-Za-z0-9][A-Za-z0-9._%-]{0,31}$'
          require_safe gap_closure_parent_id "${GAP_CLOSURE_PARENT_ID:-}" '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          require_safe gap_closure_trigger "${GAP_CLOSURE_TRIGGER:-}" '^[a-z0-9_]{1,64}$'
          ARGS=(
            ingest-loop
            --market "$MARKET"
            --json
            --json-path /tmp/euro_ingest_loop.json
            --max-targets "$MAX_TARGETS"
          )
          # schedule/workflow_run events do not apply workflow_dispatch input defaults
          RUNTIME="${MAX_RUNTIME_SECONDS:-}"
          if [ -z "$RUNTIME" ]; then
            RUNTIME="2700"
          fi
          ARGS+=(--max-runtime-seconds "$RUNTIME")
          if [ -n "${MAX_BODIES:-}" ]; then
            ARGS+=(--max-bodies "$MAX_BODIES")
          fi
          RECORD_GAP_CLOSURE="${RECORD_GAP_CLOSURE_INPUT:-}"
          if [ "$RECORD_GAP_CLOSURE" != "true" ] && [ "${RECORD_TRIAL:-}" = "true" ]; then
            RECORD_GAP_CLOSURE=true
          fi
          PARENT_ID="${GAP_CLOSURE_PARENT_ID:-}"
          TRIGGER="${GAP_CLOSURE_TRIGGER:-}"
          if [ "$RECORD_GAP_CLOSURE" = "true" ]; then
            ARGS+=(--record-gap-closure)
            if [ -n "$PARENT_ID" ]; then
              ARGS+=(--gap-closure-title "Library ingest gap-closure rerun after engineering")
              ARGS+=(--gap-closure-summary "Verification rerun for gap-closure run $PARENT_ID")
              ARGS+=(--gap-closure-parent-id "$PARENT_ID")
              ARGS+=(--gap-closure-trigger verification_rerun)
            else
              ARGS+=(--gap-closure-title "Single-ticker library ingest gap-closure pass")
              ARGS+=(--gap-closure-summary "Highest-priority buy-tier name with outstanding library filing gaps.")
              if [ -n "$TRIGGER" ]; then
                ARGS+=(--gap-closure-trigger "$TRIGGER")
              fi
            fi
            ARGS+=(--gap-closure-review-trigger horizon_scan)
          fi
          PIN="${PIN_TICKER:-}"
          if [ -n "$PIN" ]; then
            ARGS+=(--pin-ticker "$PIN")
          fi
          ftse-library "${ARGS[@]}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/euro_ingest_loop.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"micro_compiled={'true' if data.get('micro_compiled') else 'false'}\n"
              f"gap_closure_compiled={'true' if data.get('gap_closure_compiled') else 'false'}\n"
              f"recorded_gap_closure={'true' if data.get('recorded_gap_closure') else 'false'}\n"
              f"partial={'true' if data.get('partial') else 'false'}\n",
              encoding="utf-8",
          )
          PY

      - name: Evaluate library gap-closure follow-up
        id: gap_followup
        if: >-
          steps.loop.outputs.partial != 'true'
          && steps.loop.outputs.recorded_gap_closure != 'true'
        env:
          MARKET: ${{ github.event.inputs.market || 'euro_depth' }}
        run: |
          set -euo pipefail
          if [ -n "${MARKET:-}" ] && ! [[ "$MARKET" =~ ^[a-z][a-z0-9_]{0,63}$ ]]; then
            echo "Rejecting unsafe dispatch input: market" >&2
            exit 1
          fi
          ftse-library ingest-gap-closure-followup \
            --market "$MARKET" \
            --loop-json /tmp/euro_ingest_loop.json \
            --json \
            --json-path /tmp/gap_followup.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/gap_followup.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"should_dispatch={'true' if data.get('should_dispatch') else 'false'}\n"
              f"pin_ticker={data.get('pin_ticker', '')}\n"
              f"gap_closure_trigger={data.get('trigger', 'stall_slowdown')}\n"
              f"gap_followup_reason={data.get('reason', '')}\n",
              encoding="utf-8",
          )
          PY

      - name: Dispatch library gap-closure follow-up after stall or slowdown
        if: steps.gap_followup.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/dispatch_library_gap_closure_followups.sh /tmp/gap_followup.json

      - name: Dispatch engineering queue when tasks were added
        if: >-
          steps.loop.outputs.micro_compiled == 'true'
          || steps.loop.outputs.gap_closure_compiled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run engineering-queue.yml
          echo "Dispatched engineering-queue after library ingest micro-compile or gap-closure task"

      - name: Refresh completion gate and sync euro crons
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
        run: |
          ftse-library euro-ingest-dispatch --refresh --sync-cron --json --json-path /tmp/euro_dispatch_refresh.json

      - name: Commit and push library ingest artifacts
        run: |
          bash scripts/push_library_ingest_artifacts.sh \
            'chore: euro_depth ingest loop [skip ci]'
