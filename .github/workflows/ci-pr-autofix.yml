name: CI PR Autofix

# When CI fails on a cursor/* pull request, attempt scoped fixes (ruff; engineering
# path-guard allowlist expand), push, and post a diagnosis comment. See docs/ops/ci-fix-automation.md.
#
# Security: workflow_run has access to the default GITHUB_TOKEN (write). Public fork
# PRs must not run here. Install the package from main (trusted), then check out the
# same-repo PR head for fixes. Never interpolate branch names into the shell from
# ${{ }}; pass via env and validate with a strict regex.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-pr-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  autofix:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event == 'pull_request'
      && startsWith(github.event.workflow_run.head_branch, 'cursor/')
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR branch name
        id: branch
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [[ ! "$BRANCH" =~ ^cursor/[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "Rejecting unsafe branch name"
            exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # Install tooling from main so PR-controlled setuptools/hooks never run as root of trust.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install trusted package + test deps from main
        run: |
          set -euo pipefail
          pip install ".[dev]"
          cp scripts/ci_pr_autofix.py /tmp/ci_pr_autofix.py
          cp scripts/check_changed_python.py /tmp/check_changed_python.py

      - name: Check out same-repo PR head
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BRANCH"
          git checkout --force "$SHA"

      - name: Skip if CI bot already attempted on latest commit
        id: gate
        run: |
          if git log -1 --pretty=%s | grep -q '^chore(ci):'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Latest commit is already a CI bot fix — skipping to avoid loops"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch failed CI logs
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --log-failed > /tmp/ci_failed.log 2>&1 || true

      - name: Attempt CI autofix pipeline
        if: steps.gate.outputs.skip != 'true'
        id: autofix
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin main
          if python3 /tmp/ci_pr_autofix.py \
            --base origin/main \
            --head HEAD \
            --branch "$BRANCH" \
            --log-file /tmp/ci_failed.log \
            --out /tmp/autofix_result.json \
            --diagnosis-out /tmp/ci_diagnosis.json; then
            echo "fixed=true" >> "$GITHUB_OUTPUT"
          else
            echo "fixed=false" >> "$GITHUB_OUTPUT"
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/autofix_result.json").read_text())
          actions = data.get("actions") or []
          Path("/tmp/autofix_actions.txt").write_text(",".join(actions))
          commit_msg = data.get("commit_message") or ""
          Path("/tmp/autofix_commit_message.txt").write_text(commit_msg)
          PY

      - name: Verify autofix (ruff + path guard + pytest)
        if: steps.autofix.outputs.fixed == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          python3 /tmp/check_changed_python.py --base origin/main --head HEAD
          if [[ "$BRANCH" =~ ^cursor/eng-[0-9]{8}-[0-9]{2}-1de3$ ]]; then
            git diff --name-only origin/main...HEAD > /tmp/changed_files.txt
            ftse-engineering check-pr-paths \
              --branch "$BRANCH" \
              --changed-files /tmp/changed_files.txt
          fi
          pytest -q

      - name: Configure git author
        if: steps.autofix.outputs.fixed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push autofix
        id: push
        if: steps.autofix.outputs.fixed == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          ACTIONS="$(cat /tmp/autofix_actions.txt)"
          git add src/ tests/ scripts/
          if [[ "$ACTIONS" == *"path_guard_expand"* ]]; then
            git add docs/data/engineering_tasks.json
          fi
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No staged changes after autofix"
            exit 0
          fi
          COMMIT_MSG="$(cat /tmp/autofix_commit_message.txt)"
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="chore(ci): autofix on changed files"
          fi
          git commit -m "$COMMIT_MSG"
          git push origin "HEAD:${BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_message=$COMMIT_MSG" >> "$GITHUB_OUTPUT"

      - name: Comment on pull request
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_SHA: ${{ steps.push.outputs.commit_sha }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            echo "No open PR for branch $BRANCH — skipping comment"
            exit 0
          fi
          if [ ! -f /tmp/autofix_result.json ]; then
            echo "No autofix result — skipping comment"
            exit 0
          fi
          docs_url="https://github.com/${REPO}/blob/main/docs/ops/ci-fix-automation.md#pr-ci-monitoring"
          DOCS_URL="$docs_url" python3 - <<'PY' > /tmp/autofix_comment.md
          import json
          import os
          from pathlib import Path
          from value_investor.ci_pr_autofix import PrCiDiagnosis, format_pr_ci_comment

          result = json.loads(Path("/tmp/autofix_result.json").read_text())
          diagnosis_path = Path("/tmp/ci_diagnosis.json")
          diagnosis = result.get("diagnosis") or {}
          if diagnosis_path.exists() and not diagnosis:
              diagnosis = json.loads(diagnosis_path.read_text())

          diag = PrCiDiagnosis(
              kinds=list(diagnosis.get("kinds") or []),
              branch=str(diagnosis.get("branch") or os.environ["BRANCH"]),
              engineering_task_id=diagnosis.get("engineering_task_id"),
              path_guard_violations=list(diagnosis.get("path_guard_violations") or []),
              pytest_failures=list(diagnosis.get("pytest_failures") or []),
              hints=list(diagnosis.get("hints") or []),
          )
          fixed = os.environ.get("PUSHED") == "true"
          body = format_pr_ci_comment(
              diagnosis=diag,
              failed_run_id=os.environ["FAILED_RUN_ID"],
              failed_run_url=os.environ["FAILED_RUN_URL"],
              fixed=fixed,
              actions=list(result.get("actions") or []),
              commit_sha=os.environ.get("COMMIT_SHA") or None,
              docs_url=os.environ.get("DOCS_URL"),
          )
          print(body, end="")
          PY
          gh pr comment "$pr_number" --body-file /tmp/autofix_comment.md
