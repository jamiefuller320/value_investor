name: CI PR Autofix

# When CI fails on a cursor/* pull request, attempt scoped ruff autofix, push, and
# re-trigger CI. See docs/ops/ci-fix-automation.md#pr-ruff-autofix.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-pr-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  autofix:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event == 'pull_request'
      && startsWith(github.event.workflow_run.head_branch, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + test deps
        run: pip install -e ".[dev]"

      - name: Skip if autofix already attempted
        id: gate
        run: |
          if git log -1 --pretty=%s | grep -q 'chore(ci): autofix'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Latest commit is already an autofix — skipping to avoid loops"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch failed CI logs
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view "${{ github.event.workflow_run.id }}" --log-failed > /tmp/ci_failed.log 2>&1 || true

      - name: Attempt ruff autofix
        if: steps.gate.outputs.skip != 'true'
        id: autofix
        run: |
          set -euo pipefail
          git fetch origin main
          if python3 scripts/ci_pr_autofix.py \
            --base origin/main \
            --head HEAD \
            --log-file /tmp/ci_failed.log \
            --out /tmp/autofix_result.json; then
            echo "fixed=true" >> "$GITHUB_OUTPUT"
          else
            echo "fixed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify autofix (ruff + pytest)
        if: steps.autofix.outputs.fixed == 'true'
        run: |
          python3 scripts/check_changed_python.py --base origin/main --head HEAD
          pytest -q

      - name: Configure git author
        if: steps.autofix.outputs.fixed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push autofix
        id: push
        if: steps.autofix.outputs.fixed == 'true'
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          git add src/ tests/ scripts/
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No staged changes after autofix"
            exit 0
          fi
          git commit -m "chore(ci): autofix ruff on changed Python files"
          git push origin "HEAD:${BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment on pull request
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_SHA: ${{ steps.push.outputs.commit_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            echo "No open PR for branch $BRANCH — skipping comment"
            exit 0
          fi
          docs_url="https://github.com/${REPO}/blob/main/docs/ops/ci-fix-automation.md#pr-ruff-autofix"
          sed 's/^ *//' > /tmp/autofix_comment.md <<EOF
          ## CI autofix (ruff)

          Scoped **ruff** autofix was applied and pushed to this branch after the failed CI run.

          | | |
          |--|--|
          | Failed run | [${FAILED_RUN_ID}](${FAILED_RUN_URL}) |
          | Fix commit | \`${COMMIT_SHA}\` |
          | Commit message | \`chore(ci): autofix ruff on changed Python files\` |

          CI should re-run on the new commit automatically. This workflow does **not** autofix pytest or \`check_committed_data_json\` failures.

          Details: [ci-fix-automation — PR ruff autofix](${docs_url})
          EOF
          gh pr comment "$pr_number" --body-file /tmp/autofix_comment.md
