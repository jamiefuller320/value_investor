name: Engineering Conflict Resolve

# Scoped agent: rebase/merge main into a stuck engineering PR branch and resolve
# conflicts only. Does not merge. Dispatched by project-traffic.yml.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Engineering branch (cursor/eng-YYYYMMDD-NN-1de3)"
        type: string
        required: true
      pr_number:
        description: "Pull request number"
        type: string
        required: true
      task_id:
        description: "Optional engineering task id"
        type: string
        default: ""
      kind:
        description: "conflict (first-line) or escalation (after first-line exhausted)"
        type: string
        default: "conflict"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: engineering-conflict-resolve-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        id: branch
        env:
          BRANCH: ${{ github.event.inputs.branch }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ ! "$BRANCH" =~ ^cursor/eng-[0-9]{8}-[0-9]{2}-1de3$ ]]; then
            echo "Rejecting non-engineering branch: $BRANCH"
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Rejecting non-numeric PR number"
            exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.branch.outputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch main
        run: git fetch --no-tags origin main

      - name: Run conflict-resolve agent
        env:
          CURSOR_API_KEY_V2: ${{ secrets.CURSOR_API_KEY_V2 }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY_V2 || secrets.CURSOR_API_KEY }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          PR_NUMBER: ${{ steps.branch.outputs.pr_number }}
          TASK_ID: ${{ github.event.inputs.task_id }}
          KIND: ${{ github.event.inputs.kind || 'conflict' }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "::error::CURSOR_API_KEY not configured"
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          from cursor_sdk import Agent, AgentOptions, LocalAgentOptions
          from value_investor.project_traffic import (
              conflict_resolve_prompt,
              escalation_unstick_prompt,
          )

          branch = os.environ["BRANCH"]
          pr_number = int(os.environ["PR_NUMBER"])
          task_id = (os.environ.get("TASK_ID") or "").strip() or None
          kind = (os.environ.get("KIND") or "conflict").strip().lower()
          if kind == "escalation":
              prompt = escalation_unstick_prompt(
                  branch=branch, pr_number=pr_number, task_id=task_id
              )
          else:
              prompt = conflict_resolve_prompt(
                  branch=branch, pr_number=pr_number, task_id=task_id
              )
          Path("output").mkdir(exist_ok=True)
          Path("output/conflict_resolve_prompt.md").write_text(prompt, encoding="utf-8")
          result = Agent.prompt(
              prompt,
              AgentOptions(
                  api_key=os.environ["CURSOR_API_KEY"],
                  model="composer-2.5",
                  local=LocalAgentOptions(cwd=os.getcwd()),
              ),
          )
          summary = (result.result or "").strip()
          Path("output/conflict_resolve_result.md").write_text(
              summary or "Agent completed without a written report.",
              encoding="utf-8",
          )
          print(f"kind={kind} agent_id={result.id} status={result.status}")
          if result.status == "error":
              raise SystemExit(f"Unstick agent failed: {result.id}")
          PY

      - name: Push resolved branch
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          KIND: ${{ github.event.inputs.kind || 'conflict' }}
          WORKFLOW_DISPATCH_PAT: ${{ secrets.WORKFLOW_DISPATCH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${WORKFLOW_DISPATCH_PAT:-}" ]; then
            export GH_TOKEN="$WORKFLOW_DISPATCH_PAT"
          else
            export GH_TOKEN="$GITHUB_TOKEN"
          fi
          gh auth setup-git
          if git status --porcelain | grep -q .; then
            git add -A
            if [ "${KIND:-conflict}" = "escalation" ]; then
              git commit -m "fix(unstick): first-line-exhausted follow-up" || true
            else
              git commit -m "fix(conflict): resolve merge conflicts with main" || true
            fi
          fi
          git push origin "HEAD:$BRANCH"

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.branch.outputs.pr_number }}
          KIND: ${{ github.event.inputs.kind || 'conflict' }}
        run: |
          if [ "${KIND:-conflict}" = "escalation" ]; then
            BODY="## Unstick escalation agent
          First-line CI autofix / hunter-fix / conflict-resolve did not clear this PR.
          This follow-up is a one-shot algorithmic dispatch (not a standing listener).
          Review the latest commit and CI. Project traffic will unpause when stuck PRs clear.
          "
          else
            BODY="## Conflict-resolve agent
          Attempted to rebase/merge \`main\` and resolve conflicts on this branch.
          Review the latest commit and CI. Project traffic will unpause when stuck PRs clear.
          "
          fi
          gh pr comment "$PR_NUMBER" --body "$BODY"
