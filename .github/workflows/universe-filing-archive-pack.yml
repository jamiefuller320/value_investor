name: Universe filing archive pack

# Quiet-window cold archive lane (L499). Week-first then iterative-backward pack
# under archive_lane_gate. Preemptible, max concurrency 1, NOT a fourth equal
# sprint stream. Thin --apply writers use archive budgets + tiny max_units.
# Suspends while focus fat sprint is active. Cold blobs stay on the runner;
# only pack_run + bottleneck review are committed.
# See docs/ops/universe-filing-archive-pack.md
on:
  schedule:
    # Primary quiet slot: Mon–Fri 22:00 UTC (inside 21:00–05:00 quiet band).
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      allow_outside_quiet:
        description: "Pilot: allow daytime run (still suspends on focus pressure)"
        type: boolean
        default: false
      lookback_weeks:
        description: "ISO weeks to plan backward from current week"
        type: string
        default: "12"
      max_units:
        description: "Cap on week×market units (apply pilot default 2)"
        type: string
        default: "2"
      apply:
        description: "Thin quiet cold-store writers (archive budgets; tiny caps)"
        type: boolean
        default: true
      max_http_fetches:
        description: "Hard archive-lane HTTP fetch cap"
        type: string
        default: "8"

permissions:
  contents: write

concurrency:
  group: universe-filing-archive-pack
  # Preemptible: a newer dispatch cancels an in-flight pass.
  cancel-in-progress: true

jobs:
  archive-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: bash scripts/gha_pip_install.sh -e .

      - name: Run gated archive pack (thin apply / suspend fail-open)
        id: pack
        env:
          EVENT_NAME: ${{ github.event_name }}
          ALLOW_OUTSIDE_QUIET: ${{ github.event.inputs.allow_outside_quiet || 'false' }}
          APPLY_INPUT: ${{ github.event.inputs.apply }}
          LOOKBACK_WEEKS: ${{ github.event.inputs.lookback_weeks || '12' }}
          MAX_UNITS: ${{ github.event.inputs.max_units || '2' }}
          MAX_HTTP_FETCHES: ${{ github.event.inputs.max_http_fetches || '8' }}
        run: |
          set -euo pipefail
          # Schedule always applies; workflow_dispatch honors apply input (default true).
          if [ "${EVENT_NAME}" = "schedule" ] || [ -z "${APPLY_INPUT}" ] || [ "${APPLY_INPUT}" = "true" ]; then
            APPLY=true
          else
            APPLY=false
          fi
          ARGS=(--lookback-weeks "${LOOKBACK_WEEKS}" --max-units "${MAX_UNITS}" --max-http-fetches "${MAX_HTTP_FETCHES}")
          if [ "${ALLOW_OUTSIDE_QUIET}" = "true" ]; then
            ARGS+=(--allow-outside-quiet)
          fi
          if [ "${APPLY}" = "true" ]; then
            ARGS+=(--apply)
          fi
          # Exit 0 on suspend/quiet_only; writes pack_run + bottleneck review.
          ftse-universe-archive-pack "${ARGS[@]}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          run = json.loads(Path("docs/data/universe_filing_archive_pack_run.json").read_text())
          review = json.loads(Path("docs/data/universe_filing_archive_bottleneck_review.json").read_text())
          outcome = run.get("outcome") or ""
          isolation = run.get("capacity_isolation") or {}
          print(f"outcome={outcome}")
          print(f"pack_order={run.get('pack_order')}")
          print(f"dry_run={run.get('dry_run')}")
          print(f"gate={run.get('gate')}")
          print(f"plan_unit_count={run.get('plan_unit_count')}")
          print(f"units_completed={run.get('units_completed')}")
          print(f"objects_written={run.get('objects_written')}")
          print(f"isolation_ok={isolation.get('isolation_ok')}")
          print(f"http_fetches={isolation.get('http_fetches')}")
          print(f"bottlenecks={len(review.get('bottlenecks') or [])}")
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"outcome={outcome}\n")
              fh.write(f"should_commit=true\n")
          PY

      - name: Commit pack run + bottleneck review + status panel
        if: always() && steps.pack.outcome == 'success'
        env:
          COMMIT_MESSAGE: "chore: universe filing archive pack run [skip ci]"
          GHA_COMMIT_OWNED: >-
            docs/data/universe_filing_archive_pack_run.json
            docs/data/universe_filing_archive_bottleneck_review.json
            docs/data/universe_filing_archive_status.json
          GHA_COMMIT_LABEL: universe-filing-archive-pack
        run: bash scripts/gha_commit_artifacts.sh
