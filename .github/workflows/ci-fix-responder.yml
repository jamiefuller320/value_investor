name: CI Fix Responder

# When main CI fails on pytest, draft a scoped engineering task and dispatch the
# supervised queue. See docs/ops/ci-fix-automation.md.
on:
  workflow_run:
    workflows: ["CI", "CI Main Nightly"]
    types: [completed]

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: ci-fix-responder-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  respond:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.head_branch == 'main'
      && (
        github.event.workflow_run.event == 'push'
        || github.event.workflow_run.event == 'schedule'
        || github.event.workflow_run.event == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Draft scoped CI-fix engineering task
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          ftse-engineering draft-ci-fix \
            --run-id "$RUN_ID" \
            --run-url "$RUN_URL" \
            --json > /tmp/ci_fix_draft.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("/tmp/ci_fix_draft.json").read_text())
          drafted = list(data.get("drafted") or [])
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"drafted={'true' if drafted else 'false'}\n"
              f"task_ids={','.join(drafted)}\n",
              encoding="utf-8",
          )
          PY

      - name: Sync main before commit
        if: steps.draft.outputs.drafted == 'true'
        run: git pull --rebase --autostash origin main

      - name: Commit drafted CI-fix task
        if: steps.draft.outputs.drafted == 'true'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: main
          commit_message: "chore: draft CI-fix engineering task [skip ci]"
          file_pattern: docs/data/engineering_tasks.json
          skip_fetch: false

      - name: Dispatch engineering queue
        if: steps.draft.outputs.drafted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run engineering-queue.yml
