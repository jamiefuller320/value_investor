name: FTSE Analysis Review

# Read-only modelling/analysis synthesis after the weekly screen.
# Runs after dashboard data is available; does not change paper books or signals.
on:
  schedule:
  # Sunday catch-up after orchestrator/email quiet bundle (GitHub cron is best-effort).
    - cron: "30 8 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if analysis review already succeeded today"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: ftse-analysis-review
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Skip if analysis review already ran today
        id: gate
        uses: actions/github-script@v8
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        with:
          script: |
            const force = process.env.FORCE === 'true';
            if (force) {
              core.setOutput('should_run', 'true');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'analysis-review.yml';
            const runId = context.runId;
            const dayStart = new Date(Date.UTC(
              new Date().getUTCFullYear(),
              new Date().getUTCMonth(),
              new Date().getUTCDate(),
            )).toISOString();
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id, per_page: 20,
            });
            const prior = (data.workflow_runs || []).filter((r) =>
              r.id !== runId
              && r.created_at >= dayStart
              && (r.event === 'workflow_dispatch' || r.event === 'schedule')
            );
            const succeeded = prior.find((r) => r.conclusion === 'success');
            if (succeeded) {
              core.info(`Skipping — analysis review already succeeded today (run ${succeeded.id})`);
              core.setOutput('should_run', 'false');
              return;
            }
            core.setOutput('should_run', 'true');

  analysis-review:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Restore committed run history
        run: |
          mkdir -p output/history
          if [ -d docs/data/history ]; then
            cp -f docs/data/history/run_* output/history/ 2>/dev/null || true
            cp -f docs/data/history/models_* output/history/ 2>/dev/null || true
          fi

      - name: Knob calibration priors + shadow bootstrap (observe-only)
        run: |
          ftse-knob-calibrate run \
            --paper-root docs/data/paper_automation \
            --tracks rules,ai_judgment \
            --ranking-mode full_period_retrospective \
            --bootstrap-top-n 3 \
            --write --allow-empty \
            --spawn-shadow || true
          # PIT warm-start: populate shadows from parent log replay, freeze
          # forward-only endurance zero datum (skip if already seeded).
          ftse-knob-calibrate warm-start-shadow \
            --paper-root docs/data/paper_automation \
            --parent-track ai_judgment || true
          ftse-knob-calibrate endurance --paper-root docs/data/paper_automation || true

      - name: Exclusion-universe archive priors (observe-only)
        run: ftse-exclusion-universe-archive --output-dir docs/data || true

      - name: Exclusion ladder replay (rebalance_log + costs)
        run: |
          ftse-exclusion-ladder-replay run \
            --paper-root docs/data/paper_automation \
            --data-dir docs/data || true

      - name: Commit knob bootstrap artifacts
        # Persist even when the modelling agent is skipped — otherwise Sunday
        # calibrate/spawn is lost and weekday paper-auto never sees r2/r3.
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: knob bootstrap priors + calibrated shadows [skip ci]"
          file_pattern: |
            docs/data/paper_automation/knob_calibration_priors.json
            docs/data/paper_automation/calibration_shadow_endurance.json
            docs/data/paper_automation/ai_judgment_calibrated/**
            docs/data/paper_automation/ai_judgment_calibrated_r*/**
            docs/data/exclusion_universe_archive.json
            docs/data/exclusion_universe_review.json
            docs/data/paper_automation/exclusion_ladder_replay.json
            docs/data/paper_automation/exclusion_ladder_replay_review.json
            docs/data/paper_automation/ai_judgment_exclusion_*/**
          skip_fetch: false

      - name: Check analysis inputs
        id: ready
        run: |
          set +e
          ftse-analysis-review payload --json > /tmp/analysis_payload.json
          code=$?
          cat /tmp/analysis_payload.json
          if [ "$code" -ne 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Analysis inputs not ready — skipping agent run"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Run modelling analysis review
        if: steps.ready.outputs.skip != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: ftse-analysis-review run --json

      - name: Sync main before commit
        if: steps.ready.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main

      - name: Commit analysis review artifacts
        if: steps.ready.outputs.skip != 'true'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: modelling analysis review [skip ci]"
          file_pattern: |
            docs/data/analysis_review.json
            docs/data/analysis_review.md
            docs/data/analysis_tasks.json
            docs/data/paper_automation/knob_calibration_priors.json
          skip_fetch: false
