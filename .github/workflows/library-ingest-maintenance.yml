name: Library ingest maintenance

# FTSE-standard scan-then-target filing maintenance for library markets at ingest parity.
# Same quality bar and deepen volume as live ingest-loop.yml (see library_ingest_maintenance.py).
# Cadence: Mon–Sat peak (07:30/10:30) + daily off-peak (13:30/16:30) for weekend news/IR.
on:
  schedule:
    - cron: "30 7 * * 1-6"
    - cron: "30 10 * * 1-6"
    - cron: "30 13 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      markets:
        description: "Comma-separated market ids (empty = parity markets from policy)"
        type: string
        default: ""
      max_targets:
        description: "Max buy-tier tickers per market"
        type: string
        default: "62"
      max_runtime_seconds:
        description: "Runtime budget per market (seconds)"
        type: string
        default: "3600"
      max_bodies:
        description: "Max bodies to refetch per ticker"
        type: string
        default: "40"
      force:
        description: "Run even if dispatch says no maintenance markets"
        type: boolean
        default: false
      no_discovery_scan:
        description: "Skip listing-only discovery pass"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: library-ingest-maintenance
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      maintenance_markets: ${{ steps.dispatch.outputs.maintenance_markets }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: bash scripts/gha_pip_install.sh -e .

      - name: Evaluate library ingest dispatch
        id: dispatch
        run: |
          set -euo pipefail
          ftse-library euro-ingest-dispatch --json --json-path /tmp/library_ingest_dispatch.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/library_ingest_dispatch.json").read_text())
          markets = data.get("maintenance_markets") or []
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"should_run_maintenance={'true' if data.get('should_run_maintenance_ingest') else 'false'}\n"
              f"maintenance_markets={','.join(markets)}\n"
              f"mode={data.get('mode', '')}\n",
              encoding="utf-8",
          )
          PY

      - name: Skip when no parity maintenance markets
        id: gate
        uses: actions/github-script@v8
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
          SHOULD_RUN_MAINTENANCE: ${{ steps.dispatch.outputs.should_run_maintenance }}
          MARKETS: ${{ steps.dispatch.outputs.maintenance_markets }}
        with:
          script: |
            const force = process.env.FORCE === 'true';
            if (force) {
              core.setOutput('should_run', 'true');
              core.info('force=true — running library ingest maintenance');
              return;
            }
            const markets = (process.env.MARKETS || '').split(',').filter(Boolean);
            if (process.env.SHOULD_RUN_MAINTENANCE !== 'true' && markets.length === 0) {
              core.setOutput('should_run', 'false');
              core.info('No parity markets configured for maintenance');
              return;
            }
            core.setOutput('should_run', 'true');

  library-ingest-maintenance:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # Exceeds per-market budget (default 3600s) + setup + commit headroom.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: bash scripts/gha_pip_install.sh -e .

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run library ingest maintenance
        env:
          MARKETS: ${{ github.event.inputs.markets }}
          MAX_TARGETS: ${{ github.event.inputs.max_targets }}
          MAX_RUNTIME_SECONDS: ${{ github.event.inputs.max_runtime_seconds }}
          MAX_BODIES: ${{ github.event.inputs.max_bodies }}
          NO_DISCOVERY_SCAN: ${{ github.event.inputs.no_discovery_scan }}
        run: |
          set -euo pipefail
          require_safe() {
            local name="$1" val="$2" re="$3"
            if [ -n "$val" ] && ! [[ "$val" =~ $re ]]; then
              echo "Rejecting unsafe dispatch input: $name" >&2
              exit 1
            fi
          }
          require_safe markets "${MARKETS:-}" '^[a-z0-9_,]+$'
          require_safe max_targets "${MAX_TARGETS:-}" '^[0-9]+$'
          require_safe max_runtime_seconds "${MAX_RUNTIME_SECONDS:-}" '^[0-9]+$'
          require_safe max_bodies "${MAX_BODIES:-}" '^[0-9]+$'
          ARGS=(ingest-maintenance --json --json-path /tmp/library_ingest_maintenance.json)
          if [ -n "${MARKETS:-}" ]; then
            ARGS+=(--markets "$MARKETS")
          fi
          if [ -n "${MAX_TARGETS:-}" ]; then
            ARGS+=(--max-targets "$MAX_TARGETS")
          fi
          RUNTIME="${MAX_RUNTIME_SECONDS:-}"
          if [ -z "$RUNTIME" ]; then
            RUNTIME="3600"
          fi
          ARGS+=(--max-runtime-seconds "$RUNTIME")
          if [ -n "${MAX_BODIES:-}" ]; then
            ARGS+=(--max-bodies "$MAX_BODIES")
          fi
          if [ "${NO_DISCOVERY_SCAN:-}" = "true" ]; then
            ARGS+=(--no-discovery-scan)
          fi
          ftse-library "${ARGS[@]}"

      - name: Refresh completion gate and sync crons
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
        run: |
          ftse-library euro-ingest-dispatch --refresh --sync-cron --json --json-path /tmp/library_dispatch_refresh.json

      - name: Commit and push library ingest artifacts
        run: |
          bash scripts/push_library_ingest_artifacts.sh \
            'chore: library ingest maintenance [skip ci]'
