name: FTSE Data Backup

# Weekly tier-1 snapshot of committed docs/data after the Sunday bundle.
# Produces a GitHub Actions artifact (90-day retention) and optional S3 upload.
on:
  schedule:
    - cron: "30 12 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if data backup already succeeded today"
        type: boolean
        default: false
      include_tier2:
        description: "Include tier-2 JSON files in the snapshot"
        type: boolean
        default: false
      upload_s3:
        description: "Upload to BACKUP_S3_URI when configured"
        type: boolean
        default: true
      email_backup:
        description: "Email manifest + chunked archive to BACKUP_EMAIL_TO"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ftse-data-backup
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Skip if data backup already ran today
        id: gate
        uses: actions/github-script@v8
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        with:
          script: |
            const force = process.env.FORCE === 'true';
            if (force) {
              core.setOutput('should_run', 'true');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'data-backup.yml';
            const runId = context.runId;
            const dayStart = new Date(Date.UTC(
              new Date().getUTCFullYear(),
              new Date().getUTCMonth(),
              new Date().getUTCDate(),
            )).toISOString();
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id, per_page: 20,
            });
            const prior = (data.workflow_runs || []).filter((r) =>
              r.id !== runId
              && r.created_at >= dayStart
              && (r.event === 'workflow_dispatch' || r.event === 'schedule')
            );
            const succeeded = prior.find((r) => r.conclusion === 'success');
            if (succeeded) {
              core.info(`Skipping — data backup already succeeded today (run ${succeeded.id})`);
              core.setOutput('should_run', 'false');
              return;
            }
            core.setOutput('should_run', 'true');

  backup:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Create tier-1 snapshot
        id: snap
        run: |
          set -euo pipefail
          ARGS=(snapshot --json)
          if [ "${{ github.event.inputs.include_tier2 || 'false' }}" = "true" ]; then
            ARGS+=(--include-tier2)
          fi
          if [ "${{ github.event.inputs.upload_s3 || 'true' }}" = "true" ]; then
            ARGS+=(--upload)
          fi
          if [ "${{ github.event.inputs.email_backup || 'true' }}" = "true" ]; then
            ARGS+=(--email)
          fi
          ftse-data-backup "${ARGS[@]}" > /tmp/backup.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("/tmp/backup.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"archive_path={data['archive_path']}\n"
              f"manifest_path={data['manifest_path']}\n",
              encoding="utf-8",
          )
          PY
        env:
          BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BACKUP_EMAIL_TO: ${{ secrets.BACKUP_EMAIL_TO }}

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ftse-tier1-data-backup
          path: |
            output/backups/ftse-tier1-*.tar.gz
            output/backups/ftse-tier1-*.manifest.json
          retention-days: 90
          if-no-files-found: error

      - name: S3 upload note
        if: always()
        run: |
          if [ -f /tmp/backup.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/backup.json").read_text())
          upload = payload.get("upload") or {}
          email = payload.get("email") or {}
          if upload.get("uploaded"):
              print(f"S3 upload ok: {upload.get('archive_dest')}")
          else:
              print(f"S3 upload skipped: {upload.get('reason', 'not requested')}")
          if email.get("emailed"):
              print(
                  f"Email backup ok: {email.get('email_to')} "
                  f"({email.get('parts')} part(s))"
              )
          elif "${{ github.event.inputs.email_backup || 'true' }}" == "true":
              print("Email backup not recorded in snapshot output")
          PY
          fi
