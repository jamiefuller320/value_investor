name: FTSE Data Backup

# Weekly tier-1 snapshot of committed docs/data after the Sunday bundle,
# plus a source-code tarball (git-tracked files except docs/data).
# Produces GitHub Actions artifacts (90-day retention) and optional S3 upload.
on:
  schedule:
    - cron: "30 12 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if data backup already succeeded today"
        type: boolean
        default: false
      include_tier2:
        description: "Include tier-2 JSON files in the snapshot"
        type: boolean
        default: false
      include_code:
        description: "Also snapshot source code (excludes docs/data)"
        type: boolean
        default: true
      code_only:
        description: "Snapshot and upload source code only (skip docs/data)"
        type: boolean
        default: false
      upload_s3:
        description: "Upload to BACKUP_S3_URI when configured"
        type: boolean
        default: true
      email_backup:
        description: "Email manifest + chunked archive to BACKUP_EMAIL_TO"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ftse-data-backup
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Skip if data backup already ran today
        id: gate
        uses: actions/github-script@v8
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
          CODE_ONLY: ${{ github.event.inputs.code_only || 'false' }}
        with:
          script: |
            const force = process.env.FORCE === 'true';
            const codeOnly = process.env.CODE_ONLY === 'true';
            if (force || codeOnly) {
              core.setOutput('should_run', 'true');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'data-backup.yml';
            const runId = context.runId;
            const dayStart = new Date(Date.UTC(
              new Date().getUTCFullYear(),
              new Date().getUTCMonth(),
              new Date().getUTCDate(),
            )).toISOString();
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id, per_page: 20,
            });
            const prior = (data.workflow_runs || []).filter((r) =>
              r.id !== runId
              && r.created_at >= dayStart
              && (r.event === 'workflow_dispatch' || r.event === 'schedule')
            );
            const succeeded = prior.find((r) => r.conclusion === 'success');
            if (succeeded) {
              core.info(`Skipping — data backup already succeeded today (run ${succeeded.id})`);
              core.setOutput('should_run', 'false');
              return;
            }
            core.setOutput('should_run', 'true');

  backup:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Create tier-1 snapshot
        id: snap
        if: ${{ github.event.inputs.code_only != 'true' }}
        run: |
          set -euo pipefail
          ARGS=(snapshot --json)
          if [ "${{ github.event.inputs.include_tier2 || 'false' }}" = "true" ]; then
            ARGS+=(--include-tier2)
          fi
          ftse-data-backup "${ARGS[@]}" > /tmp/backup.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("/tmp/backup.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"archive_path={data['archive_path']}\n"
              f"manifest_path={data['manifest_path']}\n",
              encoding="utf-8",
          )
          PY

      - name: Create code snapshot
        id: code
        if: ${{ github.event_name != 'workflow_dispatch' || format('{0}', github.event.inputs.include_code) != 'false' || format('{0}', github.event.inputs.code_only) == 'true' }}
        run: |
          set -euo pipefail
          ftse-data-backup snapshot --code --json > /tmp/code-backup.json

      - name: Upload data backup artifact
        if: ${{ github.event.inputs.code_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ftse-tier1-data-backup
          path: |
            output/backups/ftse-tier1-*.tar.gz
            output/backups/ftse-tier1-*.manifest.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload code backup artifact
        if: ${{ github.event_name != 'workflow_dispatch' || format('{0}', github.event.inputs.include_code) != 'false' || format('{0}', github.event.inputs.code_only) == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ftse-code-backup
          path: |
            output/backups/ftse-code-*.tar.gz
            output/backups/ftse-code-*.manifest.json
          retention-days: 90
          if-no-files-found: error

      - name: Optional S3 upload
        if: ${{ github.event_name != 'workflow_dispatch' || format('{0}', github.event.inputs.upload_s3) != 'false' }}
        continue-on-error: true
        env:
          BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          set -euo pipefail
          if [ -f /tmp/backup.json ]; then
            ftse-data-backup deliver --from-json /tmp/backup.json --upload --upload-monthly --json
          fi
          if [ -f /tmp/code-backup.json ]; then
            ftse-data-backup deliver --from-json /tmp/code-backup.json --upload --upload-monthly --json
          fi

      - name: Optional email backup
        if: ${{ github.event_name != 'workflow_dispatch' || format('{0}', github.event.inputs.email_backup) != 'false' }}
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BACKUP_EMAIL_TO: ${{ secrets.BACKUP_EMAIL_TO }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/backup.json ]; then
            echo "No data snapshot — skipping email (code-only or snapshot skipped)"
            exit 0
          fi
          ftse-data-backup deliver --from-json /tmp/backup.json --email --json

      - name: Backup delivery summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def summarize(label: str, path: Path) -> None:
              if not path.exists():
                  print(f"{label}: not created")
                  return
              payload = json.loads(path.read_text())
              upload = payload.get("upload") or {}
              upload_monthly = payload.get("upload_monthly") or {}
              email = payload.get("email") or {}
              manifest = payload.get("manifest") or {}
              print(
                  f"{label} snapshot ok: {manifest.get('archive_name')} "
                  f"({manifest.get('bytes', 0):,} bytes, {manifest.get('file_count', 0)} files)"
              )
              if upload.get("uploaded"):
                  print(f"{label} S3 upload ok: {upload.get('archive_dest')}")
              elif upload:
                  detail = upload.get("reason") or upload.get("error") or "not requested"
                  print(f"{label} S3 upload skipped/failed: {detail}")
              if upload_monthly.get("uploaded"):
                  print(
                      f"{label} S3 monthly pin ok: {upload_monthly.get('archive_dest')} "
                      f"(month {upload_monthly.get('month_key')})"
                  )
              elif upload_monthly:
                  detail = upload_monthly.get("reason") or upload_monthly.get("error") or "not requested"
                  print(f"{label} S3 monthly pin skipped/failed: {detail}")
              if email.get("emailed"):
                  print(
                      f"{label} email backup ok: {email.get('email_to')} "
                      f"({email.get('parts')} part(s))"
                  )
              elif email:
                  detail = email.get("error") or "not recorded"
                  print(f"{label} email backup skipped/failed: {detail}")

          summarize("Data", Path("/tmp/backup.json"))
          summarize("Code", Path("/tmp/code-backup.json"))
          if (
              not Path("/tmp/backup.json").exists()
              and not Path("/tmp/code-backup.json").exists()
          ):
              print("No snapshot JSON — snapshot steps did not complete")
          PY
