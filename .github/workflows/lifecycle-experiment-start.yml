name: Lifecycle experiment start

# Human Start from the Lifecycle recommend card when paper_execute_graduated is ready.
# Authorizes and enables 4× weekly entry DCA on graduated_allocation only.
# graduated_allocation is frozen (assessment_model.json), so execute is blocked
# fail-closed until N135 retargets it.
# Never auto-applies on Sunday refresh; never touches primary/live or starter fraction.
on:
  repository_dispatch:
    types: [lifecycle-experiment-start]
  workflow_dispatch:
    inputs:
      experiment_id:
        description: Experiment id to start (entry_dca_overlay)
        required: true
        type: string
      factor_id:
        description: Lifecycle factor id (optional)
        required: false
        type: string
      kind:
        description: Start kind (optional_execute only)
        required: false
        default: optional_execute
        type: string
      cadence:
        description: Entry DCA cadence id (default leading / dca_4x_weekly)
        required: false
        type: string
      track_id:
        description: Paper track (graduated_allocation only)
        required: false
        default: graduated_allocation
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: lifecycle-experiment-start
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Start graduated entry DCA execute + refresh board
        env:
          EXPERIMENT_ID: ${{ github.event.client_payload.experiment_id || github.event.inputs.experiment_id }}
          FACTOR_ID: ${{ github.event.client_payload.factor_id || github.event.inputs.factor_id }}
          KIND: ${{ github.event.client_payload.kind || github.event.inputs.kind || 'optional_execute' }}
          DECISION: ${{ github.event.client_payload.decision || 'start_execute_graduated' }}
          NOTE: ${{ github.event.client_payload.note || '' }}
          CADENCE: ${{ github.event.client_payload.cadence || github.event.inputs.cadence || '' }}
          TRACK_ID: ${{ github.event.client_payload.track_id || github.event.inputs.track_id || 'graduated_allocation' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from value_investor.lifecycle_experiment_start import run_lifecycle_experiment_start

          result = run_lifecycle_experiment_start(
              Path("docs/data"),
              experiment_id=os.environ.get("EXPERIMENT_ID") or "",
              factor_id=(os.environ.get("FACTOR_ID") or None) or None,
              kind=os.environ.get("KIND") or "optional_execute",
              decision=os.environ.get("DECISION") or "start_execute_graduated",
              note=os.environ.get("NOTE") or "",
              source="dashboard_bridge",
              started_by="dashboard",
              track_id=os.environ.get("TRACK_ID") or "graduated_allocation",
              cadence=(os.environ.get("CADENCE") or None) or None,
          )
          print(json.dumps(result, indent=2, sort_keys=True, default=str))
          PY

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit dashboard slices
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: lifecycle experiment start graduated execute from dashboard [skip ci]"
          file_pattern: |
            docs/data/experiment_starts.json
            docs/data/experiment_assessment.json
            docs/data/entry_dca_adoption_plan.json
            docs/data/lifecycle_board.json
            docs/data/paper_automation/graduated_allocation/config.json
            docs/data/paper_automation/graduated_allocation/entry_dca_pending.json
          skip_fetch: false

      - name: Notify dashboard channel
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PY'
          from value_investor.dashboard_bridge import broadcast_dashboard_update
          broadcast_dashboard_update(
              event="artifact-updated",
              payload={"artifact": "lifecycle_board", "source": "lifecycle-experiment-start"},
          )
          PY
