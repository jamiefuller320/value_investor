name: FTSE Engineering Queue

# Hourly weekday processor for the supervised engineering task queue.
# Dispatches engineering-agent when:
# - open tasks remain in docs/data/engineering_tasks.json
# - no open engineering PR is in flight
# - ad-hoc spend checkpoint not reached (unless force)
#
# Also runs on engineering PR merge to mark the task merged, reprioritize
# open ingest/scoring tasks, and chain the next task.
on:
  schedule:
  # Hourly on weekdays (UTC). GitHub cron is best-effort; safe to re-fire.
    - cron: "0 * * * 1-5"
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Dispatch even if ad-hoc spend checkpoint is reached"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  pull-requests: read

# Security: pull_request heads are untrusted. Pass branch/URL via env after a
# strict eng-branch regex — never ${{ github.event.pull_request.* }} inside run:.
concurrency:
  group: ftse-engineering-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        # Include [dev] so post-merge verify-merged can run pytest (L161).
        run: pip install -e ".[dev]"

      - name: Detect merged engineering task branch
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.merged == true
        id: eng_branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Pass PR head via env — never ${{ }}-interpolate into the shell.
          if [[ "$BRANCH" =~ ^cursor/eng-[0-9]{8}-[0-9]{2}-1de3$ ]]; then
            echo "is_task=true" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "is_task=false" >> "$GITHUB_OUTPUT"
            echo "branch=" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark merged engineering task
        if: steps.eng_branch.outputs.is_task == 'true'
        env:
          BRANCH: ${{ steps.eng_branch.outputs.branch }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ftse-engineering mark-merged \
            --branch "$BRANCH" \
            --pr-url "$PR_URL" \
            --pr-number "$PR_NUMBER"

      - name: Reprioritize queue after ingest merge
        if: steps.eng_branch.outputs.is_task == 'true'
        env:
          BRANCH: ${{ steps.eng_branch.outputs.branch }}
        run: |
          TASK_ID=$(BRANCH="$BRANCH" python3 - <<'PY'
          import os
          from value_investor.engineering_queue import task_id_from_branch
          print(task_id_from_branch(os.environ.get("BRANCH", "")) or "")
          PY
          )
          if [ -n "$TASK_ID" ]; then
            ftse-engineering --json reprioritize --merged-task-id "$TASK_ID"
          fi

      - name: Evaluate ingest gap-closure rerun after gap-fix merge
        if: steps.eng_branch.outputs.is_task == 'true'
        id: gap_rerun
        env:
          BRANCH: ${{ steps.eng_branch.outputs.branch }}
        run: |
          TASK_ID=$(BRANCH="$BRANCH" python3 - <<'PY'
          import os
          from value_investor.engineering_queue import task_id_from_branch
          print(task_id_from_branch(os.environ.get("BRANCH", "")) or "")
          PY
          )
          echo "merged_task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          export TASK_ID
          python3 - <<'PY' | tee /tmp/gap_rerun.json
          import json
          import os
          from value_investor.engineering_queue import ingest_gap_closure_rerun_dispatch
          task_id = os.environ.get("TASK_ID", "")
          print(json.dumps(ingest_gap_closure_rerun_dispatch(task_id), indent=2))
          PY
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/gap_rerun.json").read_text())
          parent = data.get("parent_run_id") or data.get("parent_trial_id") or ""
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as handle:
              handle.write(
                  f"should_rerun_gap_closure={'true' if data.get('should_dispatch') else 'false'}\n"
                  f"pin_ticker={data.get('pin_ticker', '')}\n"
                  f"gap_closure_parent_id={parent}\n"
                  f"gap_rerun_reason={data.get('reason', '')}\n"
                  f"rerun_workflow={data.get('rerun_workflow', 'ingest-loop.yml')}\n"
                  f"market_id={data.get('market_id', '')}\n"
              )
          PY

      - name: Rerun ingest gap-closure after engineering merge
        if: steps.gap_rerun.outputs.should_rerun_gap_closure == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ steps.gap_rerun.outputs.rerun_workflow }}
          MARKET: ${{ steps.gap_rerun.outputs.market_id }}
          PIN_TICKER: ${{ steps.gap_rerun.outputs.pin_ticker }}
          GAP_PARENT: ${{ steps.gap_rerun.outputs.gap_closure_parent_id }}
        run: |
          if [ -z "$WORKFLOW" ]; then
            WORKFLOW="ingest-loop.yml"
          fi
          case "$WORKFLOW" in
            euro-ingest-loop.yml|ingest-loop.yml) ;;
            *) echo "Rejecting unexpected workflow file: $WORKFLOW"; exit 1 ;;
          esac
          if [ "$WORKFLOW" = "euro-ingest-loop.yml" ]; then
            if [ -z "$MARKET" ]; then
              MARKET="euro_depth"
            fi
            gh workflow run euro-ingest-loop.yml \
              -f market="$MARKET" \
              -f max_targets=1 \
              -f max_bodies=40 \
              -f max_runtime_seconds=2100 \
              -f force=true \
              -f record_gap_closure=true \
              -f pin_ticker="$PIN_TICKER" \
              -f gap_closure_parent_id="$GAP_PARENT"
            echo "Dispatched euro-ingest-loop gap-closure verification for $PIN_TICKER ($MARKET)"
          else
            gh workflow run ingest-loop.yml \
              -f max_targets=1 \
              -f max_bodies=40 \
              -f bootstrap_seed_cap=0 \
              -f max_runtime_seconds=2100 \
              -f force=true \
              -f record_gap_closure=true \
              -f pin_ticker="$PIN_TICKER" \
              -f gap_closure_parent_id="$GAP_PARENT"
            echo "Dispatched ingest-loop gap-closure verification for $PIN_TICKER"
          fi

      # L161: generic post-merge acceptance proof + capped rework (skips gap-closure tasks).
      - name: Post-merge acceptance verify (pytest) + capped rework
        if: >-
          steps.eng_branch.outputs.is_task == 'true'
          && steps.gap_rerun.outputs.should_rerun_gap_closure != 'true'
        id: accept_verify
        env:
          BRANCH: ${{ steps.eng_branch.outputs.branch }}
          MERGED_TASK_ID: ${{ steps.gap_rerun.outputs.merged_task_id }}
        run: |
          TASK_ID="$MERGED_TASK_ID"
          if [ -z "$TASK_ID" ]; then
            TASK_ID=$(BRANCH="$BRANCH" python3 - <<'PY'
          import os
          from value_investor.engineering_queue import task_id_from_branch
          print(task_id_from_branch(os.environ.get("BRANCH", "")) or "")
          PY
            )
          fi
          echo "merged_task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          if [ -z "$TASK_ID" ]; then
            echo "should_rework=false" >> "$GITHUB_OUTPUT"
            echo "verify_action=skip" >> "$GITHUB_OUTPUT"
            echo "verify_reason=no_task_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ftse-engineering --json verify-merged --task-id "$TASK_ID" | tee /tmp/accept_verify.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/accept_verify.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as handle:
              handle.write(
                  f"should_rework={'true' if data.get('should_rework') else 'false'}\n"
                  f"verify_action={data.get('action', '')}\n"
                  f"verify_reason={data.get('reason', '')}\n"
                  f"rework_task_id={data.get('rework_task_id') or ''}\n"
              )
          print(
              f"Post-merge verify: {data.get('action')} ({data.get('reason')})"
              + (
                  f"; rework={data.get('rework_task_id')}"
                  if data.get("rework_task_id")
                  else ""
              )
          )
          PY

      - name: Refresh queue from Sunday artifacts when present
        id: refresh
        run: |
          ADDED=0
          if [ -f output/post_run_review.md ]; then
            ftse-engineering --output-dir output compile --json | tee /tmp/eng_compile.json
            ADDED=$(python3 -c "import json; print(int(json.load(open('/tmp/eng_compile.json')).get('added_open_count') or 0))")
          fi
          ftse-engineering list || true
          echo "tasks_added=$ADDED" >> "$GITHUB_OUTPUT"

      - name: Collect open PRs and running agent workflows
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Retry transient GitHub 5xx (GraphQL/API blips) so hourly queue runs
          # do not false-red on a single 503 (L148).
          retry_gh() {
            local attempt=1
            local max_attempts=4
            local delay=5
            while true; do
              if "$@"; then
                return 0
              fi
              local status=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                return "$status"
              fi
              echo "gh probe failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s…" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          retry_gh gh pr list --state open --limit 30 \
            --json number,title,headRefName,createdAt \
            > /tmp/open_prs.json
          python3 - <<'PY' | tee /tmp/agent_probe.txt
          import json
          import os
          import subprocess
          import time

          def retry_gh(argv: list[str], *, attempts: int = 4) -> str:
              delay = 5.0
              last_err: Exception | None = None
              for attempt in range(1, attempts + 1):
                  try:
                      return subprocess.check_output(argv, text=True)
                  except subprocess.CalledProcessError as err:
                      last_err = err
                      if attempt >= attempts:
                          break
                      print(
                          f"gh probe failed (attempt {attempt}/{attempts}); "
                          f"retrying in {int(delay)}s…",
                          flush=True,
                      )
                      time.sleep(delay)
                      delay *= 2
              assert last_err is not None
              raise last_err

          raw = retry_gh(
              [
                  "gh", "run", "list",
                  "--workflow", "engineering-agent.yml",
                  "--limit", "10",
                  "--json", "status",
              ]
          )
          runs = json.loads(raw)
          active = [r for r in runs if r.get("status") in {"queued", "in_progress", "waiting"}]
          count = len(active)
          out = open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8")
          out.write(f"agent_running_count={count}\n")
          out.write(f"agent_running={'true' if count > 0 else 'false'}\n")
          PY

      - name: Recover engineering queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/agent_failures.json
          import json
          import os
          from value_investor.ops_monitor import recent_workflow_failures, _github_repo, _github_token
          repo = _github_repo() or os.environ.get("GITHUB_REPOSITORY", "")
          failures = recent_workflow_failures(
              "engineering-agent.yml",
              repo=repo or None,
              token=_github_token(),
              within_hours=6,
          )
          print(json.dumps(failures))
          PY
          ftse-engineering --json recover-queue \
            --open-prs-json /tmp/open_prs.json \
            --agent-failures-json /tmp/agent_failures.json | tee /tmp/recovery.json

      - name: Engineering sync check
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' | tee /tmp/eng_sync.json
          import json
          import os
          from pathlib import Path
          from value_investor.engineering_sync import run_engineering_sync
          from value_investor.ops_monitor import recent_workflow_failures, _github_repo, _github_token
          open_prs = json.loads(Path("/tmp/open_prs.json").read_text(encoding="utf-8"))
          repo = _github_repo() or os.environ.get("GITHUB_REPOSITORY", "")
          failures = recent_workflow_failures(
              "engineering-agent.yml",
              repo=repo or None,
              token=_github_token(),
              within_hours=6,
          )
          report = run_engineering_sync(
              open_prs=open_prs,
              recent_agent_failures=failures,
              apply=True,
              repo=repo or None,
              token=_github_token(),
          )
          print(json.dumps(report.to_dict(), indent=2))
          PY
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/eng_sync.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"should_redispatch={'true' if data.get('should_redispatch') else 'false'}\n",
              encoding="utf-8",
          )
          PY

      - name: Sync main before queue file commit
        run: git pull --rebase --autostash origin main

      - name: Refresh engineering queue UI snapshot
        run: ftse-engineering refresh-queue-ui --json || true

      - name: Commit reconciled queue state
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: main
          commit_message: "chore: engineering queue recovery [skip ci]"
          file_pattern: |
            docs/data/engineering_tasks.json
            docs/data/automation.json
            docs/data/latest.json
          skip_fetch: false

      - name: Evaluate queue dispatch
        id: gate
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          ARGS="--json queue-status --open-prs-json /tmp/open_prs.json"
          ARGS="$ARGS --agent-running-count ${{ steps.probe.outputs.agent_running_count }}"
          if [ "$FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          ftse-engineering $ARGS | tee /tmp/queue_status.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from value_investor.engineering_sync import resolve_dispatch_task_id
          data = json.loads(Path("/tmp/queue_status.json").read_text())
          raw_ids = list(data.get("next_task_ids") or [])
          if not raw_ids and data.get("next_task_id"):
              raw_ids = [data.get("next_task_id")]
          resolved = [
              tid
              for tid in (resolve_dispatch_task_id(raw) or "" for raw in raw_ids)
              if tid
          ]
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"should_dispatch={'true' if data.get('should_dispatch') else 'false'}\n"
              f"reason={data.get('reason', '')}\n"
              f"next_task_ids={','.join(resolved)}\n",
              encoding="utf-8",
          )
          PY

      - name: Dispatch engineering agent
        if: >-
          (steps.gate.outputs.should_dispatch == 'true' || steps.sync.outputs.should_redispatch == 'true')
          && (github.event_name != 'pull_request' || github.event.pull_request.merged == true)
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          TASK_IDS="${{ steps.gate.outputs.next_task_ids }}"
          if [ -z "$TASK_IDS" ]; then
            INPUTS=()
            if [ "$FORCE" = "true" ]; then
              INPUTS+=( -f force=true )
            fi
            gh workflow run engineering-agent.yml "${INPUTS[@]}"
            echo "Dispatched engineering-agent for top open task"
            exit 0
          fi
          IFS=',' read -ra IDS <<< "$TASK_IDS"
          for TASK_ID in "${IDS[@]}"; do
            if [ -z "$TASK_ID" ]; then
              continue
            fi
            INPUTS=( -f task_id="$TASK_ID" )
            if [ "$FORCE" = "true" ]; then
              INPUTS+=( -f force=true )
            fi
            gh workflow run engineering-agent.yml "${INPUTS[@]}"
            echo "Dispatched engineering-agent for $TASK_ID"
          done

      - name: Sync main before merge queue commit
        if: steps.eng_branch.outputs.is_task == 'true'
        run: git pull --rebase --autostash origin main

      - name: Commit queue state
        if: steps.eng_branch.outputs.is_task == 'true'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: main
          commit_message: "chore: update engineering queue after merge [skip ci]"
          file_pattern: |
            docs/data/engineering_tasks.json
            docs/data/automation.json
            docs/data/latest.json
          skip_fetch: false

      - name: Evaluate accelerated ladder chain (coverage verify)
        if: >-
          steps.eng_branch.outputs.is_task == 'true'
          && steps.gate.outputs.should_dispatch != 'true'
        id: accel_ladder
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          TASK_ID=$(python3 - <<'PY'
          from value_investor.engineering_queue import task_id_from_branch
          import os
          print(task_id_from_branch(os.environ.get("MERGED_BRANCH", "")) or "")
          PY
          )
          echo "merged_task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          ftse-engineering try-accelerated-ladder \
            --open-prs-json /tmp/open_prs.json \
            --merged-task-id "$TASK_ID" \
            --allow-skip --json | tee /tmp/accel_ladder.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/accel_ladder.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as handle:
              handle.write(
                  f"should_dispatch={'true' if data.get('should_dispatch') else 'false'}\n"
                  f"reason={data.get('reason', '')}\n"
              )
          PY

      - name: Chain ladder_only orchestrator (coverage verify)
        if: steps.accel_ladder.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ftse-engineering record-accelerated-ladder \
            --source auto_queue_drain \
            --merged-task-id "${{ steps.accel_ladder.outputs.merged_task_id }}" \
            --note "${{ steps.accel_ladder.outputs.reason }}"
          gh workflow run automation-orchestrator.yml \
            -f suite=ladder_only \
            -f force=true
          echo "Dispatched automation-orchestrator ladder_only after coverage merge"

      - name: Evaluate accelerated email_only chain
        if: >-
          steps.eng_branch.outputs.is_task == 'true'
          && steps.gate.outputs.should_dispatch != 'true'
        id: accel
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          TASK_ID=$(python3 - <<'PY'
          from value_investor.engineering_queue import task_id_from_branch
          import os
          print(task_id_from_branch(os.environ.get("MERGED_BRANCH", "")) or "")
          PY
          )
          echo "merged_task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          ftse-engineering try-accelerated-email \
            --open-prs-json /tmp/open_prs.json \
            --merged-task-id "$TASK_ID" \
            --allow-skip --json | tee /tmp/accel_email.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/accel_email.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as handle:
              handle.write(
                  f"should_dispatch={'true' if data.get('should_dispatch') else 'false'}\n"
                  f"reason={data.get('reason', '')}\n"
              )
          PY

      - name: Chain email_only orchestrator
        if: steps.accel.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ftse-engineering record-accelerated-email \
            --source auto_queue_drain \
            --merged-task-id "${{ steps.accel.outputs.merged_task_id }}" \
            --note "${{ steps.accel.outputs.reason }}"
          gh workflow run automation-orchestrator.yml \
            -f suite=email_only \
            -f force=true
          echo "Dispatched automation-orchestrator email_only (force) after queue drain"

      - name: Sync main before accelerated review log commit
        if: steps.accel.outputs.should_dispatch == 'true'
        run: git pull --rebase --autostash origin main

      - name: Commit accelerated review log
        if: steps.accel.outputs.should_dispatch == 'true'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: main
          commit_message: "chore: log mid-week email_only chain [skip ci]"
          file_pattern: docs/data/accelerated_review.json
          skip_fetch: false

      - name: Evaluate eng-idle gap-closure dispatch
        if: steps.gate.outputs.should_dispatch != 'true'
        id: eng_idle_gap
        run: |
          python3 - <<'PY' | tee /tmp/eng_idle_gap.json
          import json
          from pathlib import Path
          from value_investor.ingest_gap_closure import evaluate_eng_idle_gap_closure_dispatch
          queue = json.loads(Path("/tmp/queue_status.json").read_text())
          status = queue.get("status") or {}
          result = evaluate_eng_idle_gap_closure_dispatch(
              open_count=int(status.get("open_count") or queue.get("open_count") or 0),
              pr_open_count=int(status.get("pr_open_count") or queue.get("pr_open_count") or 0),
              agent_running_count=int("${{ steps.probe.outputs.agent_running_count }}" or 0),
          )
          print(json.dumps(result, indent=2))
          PY
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/eng_idle_gap.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"should_dispatch={'true' if data.get('should_dispatch') else 'false'}\n"
              f"pin_ticker={data.get('pin_ticker', '')}\n"
              f"gap_closure_trigger={data.get('trigger', 'eng_idle')}\n"
              f"eng_idle_gap_reason={data.get('reason', '')}\n",
              encoding="utf-8",
          )
          PY

      - name: Dispatch eng-idle ingest gap-closure
        if: steps.eng_idle_gap.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ingest-loop.yml \
            -f max_targets=1 \
            -f max_bodies=40 \
            -f bootstrap_seed_cap=0 \
            -f max_runtime_seconds=2100 \
            -f force=true \
            -f record_gap_closure=true \
            -f pin_ticker="${{ steps.eng_idle_gap.outputs.pin_ticker }}" \
            -f gap_closure_trigger="${{ steps.eng_idle_gap.outputs.gap_closure_trigger }}"
          echo "Dispatched eng-idle gap-closure for ${{ steps.eng_idle_gap.outputs.pin_ticker }}"

      - name: Evaluate eng-idle offline ladder dispatch
        if: >-
          steps.gate.outputs.should_dispatch != 'true'
          && steps.eng_idle_gap.outputs.should_dispatch != 'true'
        id: eng_idle_offline
        run: |
          python3 - <<'PY' | tee /tmp/eng_idle_offline.json
          import json
          from pathlib import Path
          from value_investor.library_progression import evaluate_eng_idle_offline_dispatch
          queue = json.loads(Path("/tmp/queue_status.json").read_text())
          status = queue.get("status") or {}
          result = evaluate_eng_idle_offline_dispatch(
              open_count=int(status.get("open_count") or queue.get("open_count") or 0),
              pr_open_count=int(status.get("pr_open_count") or queue.get("pr_open_count") or 0),
              agent_running_count=int("${{ steps.probe.outputs.agent_running_count }}" or 0),
          )
          print(json.dumps(result, indent=2))
          PY
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/eng_idle_offline.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"should_dispatch={'true' if data.get('should_dispatch') else 'false'}\n"
              f"eng_idle_offline_reason={data.get('reason', '')}\n",
              encoding="utf-8",
          )
          PY

      - name: Dispatch eng-idle offline ladder
        if: steps.eng_idle_offline.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run automation-orchestrator.yml \
            -f suite=ladder_only \
            -f force=true
          echo "Dispatched eng-idle offline ladder: ${{ steps.eng_idle_offline.outputs.eng_idle_offline_reason }}"

      - name: Queue idle summary
        if: steps.gate.outputs.should_dispatch != 'true'
        run: |
          echo "No dispatch: ${{ steps.gate.outputs.reason }}"
          if [ "${{ steps.eng_idle_gap.outputs.should_dispatch }}" = "true" ]; then
            echo "Eng-idle gap-closure dispatched instead: ${{ steps.eng_idle_gap.outputs.eng_idle_gap_reason }}"
          elif [ "${{ steps.eng_idle_offline.outputs.should_dispatch }}" = "true" ]; then
            echo "Eng-idle offline ladder dispatched: ${{ steps.eng_idle_offline.outputs.eng_idle_offline_reason }}"
          fi

      - name: Email engineering queue blocks
        if: steps.gate.outputs.should_dispatch != 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          ftse-engineering notify-queue-blocked \
            --recovery-json /tmp/recovery.json \
            --sync-json /tmp/eng_sync.json \
            --queue-status-json /tmp/queue_status.json
