name: Engineering Hunter Fix

# When CI fails on a parked_source_hunter PR because hunter-merge-gate failed on a
# fixable reason (missing test, short SKIP, live-fetch), run one capped fix round.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: engineering-hunter-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  hunter-fix:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event == 'pull_request'
      && startsWith(github.event.workflow_run.head_branch, 'cursor/eng-')
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR branch name
        id: branch
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [[ ! "$BRANCH" =~ ^cursor/eng-[0-9]{8}-[0-9]{2}-1de3$ ]]; then
            echo "Rejecting non-engineering branch"
            exit 0
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install trusted package from main
        run: pip install -e ".[dev]"

      - name: Check out same-repo PR head
        if: steps.branch.outputs.branch != ''
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BRANCH"
          git checkout --force "$SHA"

      # Fetch CI logs before skip so a new failure kind can still retry.
      - name: Fetch failed CI logs
        if: steps.branch.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --log-failed > /tmp/ci_failed.log 2>&1 || true

      - name: Skip only when tip hunter-fix already covered this failure kind
        if: steps.branch.outputs.branch != ''
        id: gate
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          SUBJECT=$(git log -1 --pretty=%s)
          if [[ ! "$SUBJECT" =~ ^chore\(hunter-fix\): ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main
          git diff --name-only origin/main...HEAD > /tmp/changed_files.txt
          python3 - <<'PY'
          import os
          from pathlib import Path
          from value_investor.hunter_auto_merge import (
              classify_hunter_fix_kind,
              evaluate_hunter_merge_gate,
              load_hunter_task_for_branch,
          )
          from value_investor.hunter_fix_agent import tip_hunter_fix_kind

          branch = os.environ["BRANCH"]
          last_kind = tip_hunter_fix_kind() or ""
          changed = [
              line.strip()
              for line in Path("/tmp/changed_files.txt").read_text().splitlines()
              if line.strip()
          ]
          current = ""
          task = load_hunter_task_for_branch(branch)
          if task is not None:
              gate = evaluate_hunter_merge_gate(
                  task=task,
                  changed_files=changed,
                  base_ref="origin/main",
                  head_ref="HEAD",
              )
              kind = classify_hunter_fix_kind(gate)
              current = kind.value if kind else ""
          skip = bool(last_kind and current and last_kind == current)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"skip={'true' if skip else 'false'}\n")
              fh.write(f"last_kind={last_kind}\n")
              fh.write(f"current_kind={current}\n")
          print(f"tip_fix_kind={last_kind!r} current_kind={current!r} skip={skip}")
          PY

      - name: Check hunter-fix eligibility
        if: steps.branch.outputs.branch != '' && steps.gate.outputs.skip != 'true'
        id: eligible
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --name-only origin/main...HEAD > /tmp/changed_files.txt
          if ftse-engineering hunter-fix-eligible \
            --branch "$BRANCH" \
            --base-ref origin/main \
            --head-ref HEAD \
            --changed-files /tmp/changed_files.txt \
            --ci-log /tmp/ci_failed.log \
            --require-ci-log \
            --json > /tmp/hunter_fix_eligible.json; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/hunter_fix_eligible.json").read_text())
          print(f"hunter-fix-eligible: {data.get('eligible')} — {data.get('reason')}")
          PY

      - name: Run hunter-fix agent
        if: >-
          steps.branch.outputs.branch != ''
          && steps.gate.outputs.skip != 'true'
          && steps.eligible.outputs.eligible == 'true'
        id: fix
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          CURSOR_API_KEY_V2: ${{ secrets.CURSOR_API_KEY_V2 }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY_V2 || secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr view "$BRANCH" --json number --jq .number 2>/dev/null || echo "")
          ARGS=(hunter-fix --branch "$BRANCH" --base-ref origin/main --head-ref HEAD --changed-files /tmp/changed_files.txt --output-dir output)
          if [ -n "$PR_NUMBER" ]; then
            ARGS+=(--pr-number "$PR_NUMBER")
          fi
          # Agent may leave a passing SKIP/ALLOWLIST fix only in the working tree.
          # Always continue so we can commit before re-running the merge gate.
          if ftse-engineering "${ARGS[@]}" --json | tee /tmp/hunter_fix_result.json; then
            echo "gate_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "gate_pass=false" >> "$GITHUB_OUTPUT"
          fi
      # Commit before verify: hunter-merge-gate reads committed HEAD. Stage only
      # hunter-allowlisted paths so ops JSON churn cannot pollute the PR.
      - name: Commit and push hunter-fix
        if: >-
          steps.branch.outputs.branch != ''
          && steps.gate.outputs.skip != 'true'
          && steps.eligible.outputs.eligible == 'true'
        id: commit
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          from value_investor.hunter_auto_merge import (
              HUNTER_AUTO_MERGE_ALLOWED_FILES,
              strip_unexpected_hunter_files,
          )
          strip_unexpected_hunter_files(base_ref="origin/main")
          for path in sorted(HUNTER_AUTO_MERGE_ALLOWED_FILES):
              if Path(path).exists():
                  subprocess.run(["git", "add", "--", path], check=False)
          PY
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No allowlisted changes after hunter-fix agent"
            exit 0
          fi
          FIX_KIND=$(python3 -c "import json; print(json.load(open('/tmp/hunter_fix_result.json')).get('fix_kind') or 'gate')")
          git commit -m "chore(hunter-fix): address hunter-merge-gate ${FIX_KIND}"
          git push origin "HEAD:$BRANCH"
          git diff --name-only origin/main...HEAD > /tmp/changed_files.txt
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Verify hunter merge gate after fix
        id: verify
        if: >-
          steps.branch.outputs.branch != ''
          && steps.gate.outputs.skip != 'true'
          && steps.eligible.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          if ftse-engineering hunter-merge-gate \
            --branch "${{ steps.branch.outputs.branch }}" \
            --base-ref origin/main \
            --head-ref HEAD \
            --changed-files /tmp/changed_files.txt; then
            echo "gate_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "gate_pass=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Park unfixable hunter PR (not eligible for fix)
        if: >-
          always()
          && steps.branch.outputs.branch != ''
          && steps.gate.outputs.skip != 'true'
          && steps.eligible.outputs.eligible == 'false'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr view "$BRANCH" --json number,headRefName > /tmp/open_pr.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path("/tmp/open_pr.json").read_text())
          Path("/tmp/open_prs.json").write_text(json.dumps([row]), encoding="utf-8")
          PY
          ftse-engineering park-unfixable-pr \
            --branch "$BRANCH" \
            --open-prs-json /tmp/open_prs.json \
            --base-ref origin/main \
            --head-ref HEAD \
            --trust-local-gate \
            || true

      # Prefer verify outcome over the agent's pre-commit gate_pass: the agent
      # may report failure against HEAD, then a committed SKIP/ALLOWLIST passes.
      - name: Park hunter PR after exhausted hunter-fix
        if: >-
          always()
          && steps.branch.outputs.branch != ''
          && (
            steps.gate.outputs.skip == 'true'
            || steps.verify.outputs.gate_pass == 'false'
            || steps.verify.conclusion == 'failure'
          )
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr view "$BRANCH" --json number,headRefName > /tmp/open_pr.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path("/tmp/open_pr.json").read_text())
          Path("/tmp/open_prs.json").write_text(json.dumps([row]), encoding="utf-8")
          PY
          ftse-engineering park-unfixable-pr \
            --branch "$BRANCH" \
            --open-prs-json /tmp/open_prs.json \
            --base-ref origin/main \
            --head-ref HEAD \
            --trust-local-gate \
            || true
