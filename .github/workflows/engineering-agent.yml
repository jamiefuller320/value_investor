name: FTSE Engineering Agent

# Weekday / on-demand supervised dev agent for one engineering task.
# Compiles tasks from the latest Sunday run artifacts, implements the top
# open task, and opens a draft PR. Does not auto-merge.
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Specific engineering task id (leave empty for top priority)"
        type: string
        default: ""
      compile_only:
        description: "Only compile engineering_tasks.json; do not run agent"
        type: boolean
        default: false
      pr_only:
        description: "Open draft PR for an existing remote branch (skip agent run)"
        type: boolean
        default: false
      force:
        description: "Run even if ad-hoc spend checkpoint is reached"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ftse-engineering-agent
  cancel-in-progress: false

jobs:
  engineering-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system deps (CH accounts OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install package
        run: pip install -e .

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compile engineering tasks
        run: |
          ftse-engineering --output-dir output compile --json || true
          if [ ! -f docs/data/engineering_tasks.json ] && [ ! -f output/engineering_tasks.json ]; then
            echo "No engineering_tasks.json — run Sunday email with --compile-engineering-tasks first"
            exit 1
          fi
          ftse-engineering list

      - name: Resolve engineering task id
        if: ${{ github.event.inputs.compile_only != 'true' }}
        id: task
        run: |
          if [ -n "${{ github.event.inputs.task_id }}" ]; then
            TASK_ID="${{ github.event.inputs.task_id }}"
          elif [ "${{ github.event.inputs.pr_only }}" = "true" ]; then
            echo "task_id is required when pr_only is true"
            exit 1
          else
            TASK_ID=$(ftse-engineering next-open-id)
          fi
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          echo "branch=cursor/${TASK_ID}-1de3" >> "$GITHUB_OUTPUT"

      - name: Run supervised engineering agent
        if: >-
          github.event.inputs.compile_only != 'true'
          && github.event.inputs.pr_only != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          ARGS="run --max-tasks 1 --defer-pr-open"
          if [ -n "${{ steps.task.outputs.task_id }}" ]; then
            ARGS="$ARGS --task-id ${{ steps.task.outputs.task_id }}"
          fi
          if [ "$FORCE_RUN" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          ftse-engineering --output-dir output $ARGS

      - name: Clear stale engineering branch
        if: >-
          github.event.inputs.compile_only != 'true'
          && github.event.inputs.pr_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ steps.task.outputs.branch }}"
          gh pr list --state open --limit 30 \
            --json headRefName > /tmp/open_prs.json
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            if ftse-engineering branch-is-stale --branch "$BRANCH" --open-prs-json /tmp/open_prs.json; then
              echo "Deleting stale remote branch $BRANCH (no open PR)"
              git push origin --delete "$BRANCH"
            else
              echo "Remote branch $BRANCH has an open PR — refusing to delete"
              exit 1
            fi
          fi

      - name: Create feature branch for code changes
        if: >-
          github.event.inputs.compile_only != 'true'
          && github.event.inputs.pr_only != 'true'
        id: branch
        run: |
          TASK_ID="${{ steps.task.outputs.task_id }}"
          BRANCH="${{ steps.task.outputs.branch }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git fetch origin main
          git checkout -B main origin/main
          git branch -D "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          git add -A
          git reset HEAD docs/data/engineering_tasks.json || true
          git checkout -- docs/data/engineering_tasks.json || true
          if git diff --cached --quiet; then
            echo "No code changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TITLE=$(ftse-engineering task-title --task-id "$TASK_ID" --max-len 72)
          git commit -m "feat(engineering): ${TITLE}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Push branch and open draft PR
        if: >-
          github.event.inputs.compile_only != 'true'
          && (github.event.inputs.pr_only == 'true' || steps.branch.outputs.has_changes == 'true')
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ steps.task.outputs.branch }}"
          TASK_ID="${{ steps.task.outputs.task_id }}"
          TITLE=$(ftse-engineering task-title --task-id "$TASK_ID" --max-len 120)

          if [ "${{ github.event.inputs.pr_only }}" = "true" ]; then
            if ! git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
              echo "Remote branch $BRANCH not found"
              exit 1
            fi
          else
            git push -u origin "$BRANCH"
          fi

          if [ "$(gh pr list --head "$BRANCH" --base main --json number --jq 'length')" = "0" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "feat(engineering): $TITLE" \
              --body "Supervised engineering agent run for task \`$TASK_ID\`.

          ## Review checklist
          - Diff stays within task allowed_paths
          - Tests added/updated and CI green
          - No paper-fund / simulator / threshold changes unless intended
          - Verify on next Sunday email run

          _Draft PR — human merge required._" \
              --draft
          else
            echo "Draft PR already exists for $BRANCH"
          fi
          echo "opened=true" >> "$GITHUB_OUTPUT"

      - name: Mark task pr_open after draft PR
        if: >-
          github.event.inputs.compile_only != 'true'
          && steps.pr.outputs.opened == 'true'
        run: |
          git fetch origin main
          git checkout -B main origin/main
          ftse-engineering mark-pr-open \
            --task-id "${{ steps.task.outputs.task_id }}" \
            --branch "${{ steps.task.outputs.branch }}" \
            --result-path "output/engineering_result_${{ steps.task.outputs.task_id }}.md"

      - name: Sync main before pr_open queue commit
        if: >-
          github.event.inputs.compile_only != 'true'
          && steps.pr.outputs.opened == 'true'
        run: git pull --rebase --autostash origin main

      - name: Commit queue state on main
        if: >-
          github.event.inputs.compile_only != 'true'
          && steps.pr.outputs.opened == 'true'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: main
          commit_message: "chore: mark engineering task pr_open [skip ci]"
          file_pattern: docs/data/engineering_tasks.json
          skip_fetch: false
