name: FTSE Engineering Agent

# Weekday / on-demand supervised dev agent for one engineering task.
# Compiles tasks from the latest Sunday run artifacts, implements the top
# open task, and opens a draft PR. Does not auto-merge.
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Specific engineering task id (leave empty for top priority)"
        type: string
        default: ""
      compile_only:
        description: "Only compile engineering_tasks.json; do not run agent"
        type: boolean
        default: false
      force:
        description: "Run even if ad-hoc spend checkpoint is reached"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ftse-engineering-agent
  cancel-in-progress: false

jobs:
  engineering-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system deps (CH accounts OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install package
        run: pip install -e .

      - name: Compile engineering tasks
        run: |
          ftse-engineering --output-dir output compile --json || true
          if [ ! -f docs/data/engineering_tasks.json ] && [ ! -f output/engineering_tasks.json ]; then
            echo "No engineering_tasks.json — run Sunday email with --compile-engineering-tasks first"
            exit 1
          fi
          ftse-engineering list

      - name: Run supervised engineering agent
        if: ${{ github.event.inputs.compile_only != 'true' }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          ARGS="run --max-tasks 1"
          if [ -n "${{ github.event.inputs.task_id }}" ]; then
            ARGS="$ARGS --task-id ${{ github.event.inputs.task_id }}"
          fi
          if [ "$FORCE_RUN" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          ftse-engineering --output-dir output $ARGS

      - name: Commit queue state on main
        if: ${{ github.event.inputs.compile_only != 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: mark engineering task pr_open [skip ci]"
          file_pattern: docs/data/engineering_tasks.json
          skip_fetch: false

      - name: Create feature branch for code changes
        if: ${{ github.event.inputs.compile_only != 'true' }}
        run: |
          TASK_ID=$(python3 - <<'PY'
          import json
          from pathlib import Path
          for candidate in (Path("docs/data/engineering_tasks.json"), Path("output/engineering_tasks.json")):
              if candidate.exists():
                  data = json.loads(candidate.read_text())
                  break
          else:
              raise SystemExit("No engineering queue found")
          pr_open = [t for t in data.get("tasks", []) if t.get("status") == "pr_open"]
          if not pr_open:
              raise SystemExit("No pr_open engineering task after agent run")
          print(pr_open[-1]["id"])
          PY
          )
          BRANCH="cursor/${TASK_ID}-1de3"
          git checkout -b "$BRANCH"
          git add -A
          git reset HEAD docs/data/engineering_tasks.json || true
          git checkout -- docs/data/engineering_tasks.json || true
          if git diff --cached --quiet; then
            echo "No code changes to commit"
            exit 0
          fi
          TITLE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("docs/data/engineering_tasks.json").read_text())
          pr_open = [t for t in data.get("tasks", []) if t.get("status") == "pr_open"]
          print((pr_open[-1].get("title") if pr_open else "Engineering task")[:72])
          PY
          )
          git commit -m "feat(engineering): ${TITLE}"

      - name: Push branch and open draft PR
        if: ${{ github.event.inputs.compile_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=$(git branch --show-current)
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
            echo "Agent did not create a feature branch; skipping PR"
            exit 0
          fi
          git push -u origin "$BRANCH"
          TASK_ID=$(python3 - <<'PY'
          import json
          from pathlib import Path
          for candidate in (Path("docs/data/engineering_tasks.json"), Path("output/engineering_tasks.json")):
              if candidate.exists():
                  data = json.loads(candidate.read_text())
                  break
          else:
              data = {"tasks": []}
          pr_open = [t for t in data.get("tasks", []) if t.get("status") == "pr_open"]
          print(pr_open[-1]["id"] if pr_open else "engineering-task")
          PY
          )
          TITLE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          for candidate in (Path("docs/data/engineering_tasks.json"), Path("output/engineering_tasks.json")):
              if candidate.exists():
                  data = json.loads(candidate.read_text())
                  break
          else:
              data = {"tasks": []}
          pr_open = [t for t in data.get("tasks", []) if t.get("status") == "pr_open"]
          print((pr_open[-1].get("title") if pr_open else "Engineering task")[:120])
          PY
          )
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "feat(engineering): $TITLE" \
            --body "Supervised engineering agent run for task \`$TASK_ID\`.

          ## Review checklist
          - Diff stays within task allowed_paths
          - Tests added/updated and CI green
          - No paper-fund / simulator / threshold changes unless intended
          - Verify on next Sunday email run

          _Draft PR — human merge required._" \
            --draft || echo "PR may already exist"
