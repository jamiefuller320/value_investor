name: FTSE Engineering Agent

# Weekday / on-demand supervised dev agent for one engineering task.
# Compiles tasks from the latest Sunday run artifacts, implements the top
# open task, and opens a draft PR. Does not auto-merge.
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Specific engineering task id (leave empty for top priority)"
        type: string
        default: ""
      compile_only:
        description: "Only compile engineering_tasks.json; do not run agent"
        type: boolean
        default: false
      pr_only:
        description: "Open draft PR for an existing remote branch (skip agent run)"
        type: boolean
        default: false
      force:
        description: "Run even if ad-hoc spend checkpoint is reached"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ftse-engineering-agent-${{ github.event.inputs.task_id || 'auto' }}
  cancel-in-progress: false

jobs:
  engineering-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system deps (CH accounts OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install package
        run: pip install -e .

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compile engineering tasks
        if: >-
          github.event.inputs.compile_only == 'true'
          || github.event.inputs.task_id == ''
        run: |
          ftse-engineering --output-dir output compile --json || true
          if [ ! -f docs/data/engineering_tasks.json ] && [ ! -f output/engineering_tasks.json ]; then
            echo "No engineering_tasks.json — run Sunday email with --compile-engineering-tasks first"
            exit 1
          fi
          ftse-engineering list

      - name: Verify committed engineering queue
        if: >-
          github.event.inputs.compile_only != 'true'
          && github.event.inputs.task_id != ''
        run: |
          if [ ! -f docs/data/engineering_tasks.json ]; then
            echo "docs/data/engineering_tasks.json missing"
            exit 1
          fi
          ftse-engineering list

      - name: Resolve engineering task id
        if: ${{ github.event.inputs.compile_only != 'true' }}
        id: task
        run: |
          if [ -n "${{ github.event.inputs.task_id }}" ]; then
            TASK_ID=$(python3 - <<'PY'
          from value_investor.engineering_sync import resolve_dispatch_task_id
          print(resolve_dispatch_task_id("${{ github.event.inputs.task_id }}") or "")
          PY
          )
          elif [ "${{ github.event.inputs.pr_only }}" = "true" ]; then
            echo "task_id is required when pr_only is true"
            exit 1
          else
            TASK_ID=$(ftse-engineering next-open-id)
          fi
          if [ -z "$TASK_ID" ]; then
            echo "No open engineering tasks in queue"
            exit 1
          fi
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          echo "branch=cursor/${TASK_ID}-1de3" >> "$GITHUB_OUTPUT"

      - name: Run supervised engineering agent
        if: >-
          github.event.inputs.compile_only != 'true'
          && github.event.inputs.pr_only != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          ARGS="run --max-tasks 1 --defer-pr-open"
          if [ -n "${{ steps.task.outputs.task_id }}" ]; then
            ARGS="$ARGS --task-id ${{ steps.task.outputs.task_id }}"
          fi
          if [ "$FORCE_RUN" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          ftse-engineering --output-dir output $ARGS

      - name: Commit ad-hoc spend to main
        if: >-
          github.event.inputs.compile_only != 'true'
          && github.event.inputs.pr_only != 'true'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: main
          commit_message: "chore: record engineering agent spend [skip ci]"
          file_pattern: docs/data/library/policy.json
          skip_fetch: false

      - name: Clear stale engineering branch
        if: >-
          github.event.inputs.compile_only != 'true'
          && github.event.inputs.pr_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ steps.task.outputs.branch }}"
          gh pr list --state open --limit 30 \
            --json headRefName > /tmp/open_prs.json
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            if ftse-engineering branch-is-stale --branch "$BRANCH" --open-prs-json /tmp/open_prs.json; then
              echo "Deleting stale remote branch $BRANCH (no open PR)"
              git push origin --delete "$BRANCH"
            else
              echo "Remote branch $BRANCH has an open PR — refusing to delete"
              exit 1
            fi
          fi

      - name: Create feature branch for code changes
        if: >-
          github.event.inputs.compile_only != 'true'
          && github.event.inputs.pr_only != 'true'
        id: branch
        run: |
          TASK_ID="${{ steps.task.outputs.task_id }}"
          BRANCH="${{ steps.task.outputs.branch }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git fetch origin main
          git checkout -B main origin/main
          git branch -D "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          git add -A
          for path in \
            docs/data/engineering_tasks.json \
            docs/data/library/policy.json \
            src/value_investor/paper_fund.py \
            src/value_investor/simulator.py \
            src/value_investor/paper_automation_cli.py \
            .github/workflows/paper-auto.yml
          do
            git reset HEAD "$path" 2>/dev/null || true
            git checkout -- "$path" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "No code changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TITLE=$(ftse-engineering task-title --task-id "$TASK_ID" --max-len 72)
          git commit -m "feat(engineering): ${TITLE}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Record no-diff agent run
        if: >-
          github.event.inputs.compile_only != 'true'
          && github.event.inputs.pr_only != 'true'
          && steps.branch.outputs.has_changes == 'false'
        id: no_diff
        run: |
          ftse-engineering record-no-diff \
            --task-id "${{ steps.task.outputs.task_id }}" \
            --json | tee /tmp/no_diff.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/no_diff.json").read_text(encoding="utf-8"))
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as handle:
              handle.write(
                  f"recorded={'true' if data.get('recorded') else 'false'}\n"
                  f"parked={'true' if data.get('parked') else 'false'}\n"
              )
          PY

      - name: Sync main before no-diff queue commit
        if: steps.no_diff.outputs.recorded == 'true'
        run: git pull --rebase --autostash origin main

      - name: Commit no-diff queue state
        if: steps.no_diff.outputs.recorded == 'true'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: main
          commit_message: "chore: update engineering queue no-diff count [skip ci]"
          file_pattern: |
            docs/data/engineering_tasks.json
            docs/data/automation.json
            docs/data/latest.json
          skip_fetch: false

      - name: Push branch and open draft PR
        if: >-
          github.event.inputs.compile_only != 'true'
          && (github.event.inputs.pr_only == 'true' || steps.branch.outputs.has_changes == 'true')
        id: pr
        env:
          WORKFLOW_DISPATCH_PAT: ${{ secrets.WORKFLOW_DISPATCH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="${{ steps.task.outputs.branch }}"
          TASK_ID="${{ steps.task.outputs.task_id }}"
          TITLE=$(ftse-engineering task-title --task-id "$TASK_ID" --max-len 120)

          if [ -n "${WORKFLOW_DISPATCH_PAT:-}" ]; then
            export GH_TOKEN="$WORKFLOW_DISPATCH_PAT"
            USED_PAT=true
          else
            export GH_TOKEN="$GITHUB_TOKEN"
            USED_PAT=false
            echo "::warning::WORKFLOW_DISPATCH_PAT not set — PR opened with GITHUB_TOKEN; CI may require manual approval."
          fi
          gh auth setup-git

          if [ "${{ github.event.inputs.pr_only }}" = "true" ]; then
            if ! git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
              echo "Remote branch $BRANCH not found"
              exit 1
            fi
          else
            git push -u origin "$BRANCH"
          fi

          AUTO_MERGE=false
          if ftse-engineering task-auto-merge --task-id "$TASK_ID" >/dev/null 2>&1; then
            AUTO_MERGE=true
          fi

          if [ "$(gh pr list --head "$BRANCH" --base main --json number --jq 'length')" = "0" ]; then
            DRAFT_FLAG=()
            BODY_SUFFIX="Draft PR — human merge required."
            if [ "$AUTO_MERGE" = "true" ]; then
              BODY_SUFFIX="Scoped auto-merge enabled — merges when CI and path guard are green."
            else
              DRAFT_FLAG=(--draft)
            fi
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "feat(engineering): $TITLE" \
              --body "Supervised engineering agent run for task \`$TASK_ID\`.

          ## Review checklist
          - Diff stays within task allowed_paths
          - Tests added/updated and CI green
          - No paper-fund / simulator / threshold changes unless intended
          - Verify on next Sunday email run

          _${BODY_SUFFIX}_" \
              "${DRAFT_FLAG[@]}"
            echo "opened=true" >> "$GITHUB_OUTPUT"
          else
            echo "Draft PR already exists for $BRANCH"
            echo "opened=true" >> "$GITHUB_OUTPUT"
          fi

          PR_JSON=$(gh pr view "$BRANCH" --json url,number,isDraft)
          PR_URL=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])' <<<"$PR_JSON")
          PR_NUMBER=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["number"])' <<<"$PR_JSON")
          IS_DRAFT=$(python3 -c 'import json,sys; print("true" if json.load(sys.stdin)["isDraft"] else "false")' <<<"$PR_JSON")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "is_draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"
          echo "auto_merge=$AUTO_MERGE" >> "$GITHUB_OUTPUT"
          echo "used_pat=$USED_PAT" >> "$GITHUB_OUTPUT"

      - name: Email engineering PR opened
        if: >-
          github.event.inputs.compile_only != 'true'
          && steps.pr.outputs.opened == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          ARGS=(
            notify-pr-open
            --task-id "${{ steps.task.outputs.task_id }}"
            --branch "${{ steps.task.outputs.branch }}"
            --pr-url "${{ steps.pr.outputs.pr_url }}"
          )
          if [ -n "${{ steps.pr.outputs.pr_number }}" ]; then
            ARGS+=(--pr-number "${{ steps.pr.outputs.pr_number }}")
          fi
          if [ "${{ steps.pr.outputs.is_draft }}" = "true" ]; then
            ARGS+=(--is-draft)
          fi
          if [ "${{ steps.pr.outputs.auto_merge }}" = "true" ]; then
            ARGS+=(--auto-merge)
          fi
          if [ "${{ steps.pr.outputs.used_pat }}" = "true" ]; then
            ARGS+=(--used-pat)
          fi
          ftse-engineering "${ARGS[@]}" || true

      - name: Mark task pr_open after draft PR
        if: >-
          github.event.inputs.compile_only != 'true'
          && steps.pr.outputs.opened == 'true'
        run: |
          git fetch origin main
          git checkout -B main origin/main
          ftse-engineering mark-pr-open \
            --task-id "${{ steps.task.outputs.task_id }}" \
            --branch "${{ steps.task.outputs.branch }}" \
            --result-path "output/engineering_result_${{ steps.task.outputs.task_id }}.md"
          ftse-engineering refresh-queue-ui --json || true

      - name: Sync main before pr_open queue commit
        if: >-
          github.event.inputs.compile_only != 'true'
          && steps.pr.outputs.opened == 'true'
        run: git pull --rebase --autostash origin main

      - name: Commit queue state on main
        if: >-
          github.event.inputs.compile_only != 'true'
          && steps.pr.outputs.opened == 'true'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: main
          commit_message: "chore: mark engineering task pr_open [skip ci]"
          file_pattern: |
            docs/data/engineering_tasks.json
            docs/data/automation.json
            docs/data/latest.json
          skip_fetch: false
