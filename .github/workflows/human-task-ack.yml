name: Human task ack

# Observe-only human ack / approval from the Automation → Human tasks card.
# Dispatched by dashboard-bridge after a Supabase dashboard_commands insert.
# Bridge batches pending human-task-ack rows into one dispatch (GitHub concurrency
# cancels pending siblings even when cancel-in-progress is false). Commands stay
# processing until this workflow marks them done after a successful push.
# Never applies promotion, cron import, or live capital — durable record only.
on:
  repository_dispatch:
    types: [human-task-ack]
  workflow_dispatch:
    inputs:
      task_id:
        description: Human checklist task id
        required: false
        type: string
      decision:
        description: ack_observe | approve | defer
        required: false
        default: ack_observe
        type: string
      finding_fingerprint:
        description: Analysis fingerprint at ack time (optional)
        required: false
        type: string
      note:
        description: Optional note
        required: false
        type: string
      commands_json:
        description: Optional JSON array of {task_id,decision,finding_fingerprint,command_id}
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: human-task-ack
  cancel-in-progress: false

jobs:
  ack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Record human-task ack batch + refresh board
        id: record
        env:
          TASK_ID: ${{ github.event.client_payload.task_id || github.event.inputs.task_id || '' }}
          DECISION: ${{ github.event.client_payload.decision || github.event.inputs.decision || 'ack_observe' }}
          FINGERPRINT: ${{ github.event.client_payload.finding_fingerprint || github.event.inputs.finding_fingerprint || '' }}
          NOTE: ${{ github.event.client_payload.note || github.event.inputs.note || '' }}
          COMMAND_ID: ${{ github.event.client_payload.command_id || '' }}
          COMMANDS_JSON: ${{ toJson(github.event.client_payload.commands) }}
          INPUT_COMMANDS_JSON: ${{ github.event.inputs.commands_json || '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from value_investor.dashboard_bridge import commands_from_client_payload
          from value_investor.human_task_ack import run_human_task_ack_batch

          items = []
          raw_batch = os.environ.get("COMMANDS_JSON") or ""
          if raw_batch and raw_batch not in ("null", "None", ""):
              try:
                  parsed = json.loads(raw_batch)
              except json.JSONDecodeError:
                  parsed = None
              if isinstance(parsed, list):
                  items = [row for row in parsed if isinstance(row, dict)]
          if not items:
              input_batch = os.environ.get("INPUT_COMMANDS_JSON") or ""
              if input_batch.strip():
                  try:
                      parsed = json.loads(input_batch)
                  except json.JSONDecodeError:
                      parsed = None
                  if isinstance(parsed, list):
                      items = [row for row in parsed if isinstance(row, dict)]
          if not items:
              items = commands_from_client_payload(
                  {
                      "task_id": os.environ.get("TASK_ID") or "",
                      "decision": os.environ.get("DECISION") or "ack_observe",
                      "finding_fingerprint": os.environ.get("FINGERPRINT") or "",
                      "note": os.environ.get("NOTE") or "",
                      "command_id": os.environ.get("COMMAND_ID") or "",
                  }
              )
          # Drop empty workflow_dispatch shells
          items = [row for row in items if str(row.get("task_id") or "").strip()]
          if not items:
              raise SystemExit("No human-task-ack items in payload")

          result = run_human_task_ack_batch(
              Path("docs/data"),
              items,
              source="dashboard_bridge",
              acked_by="dashboard",
          )
          print(json.dumps(result, indent=2, sort_keys=True, default=str))
          command_ids = [
              str(row.get("command_id"))
              for row in items
              if str(row.get("command_id") or "").strip()
          ]
          Path("/tmp/human_task_ack_command_ids.json").write_text(
              json.dumps(command_ids), encoding="utf-8"
          )
          if result.get("errors"):
              raise SystemExit(f"ack batch had errors: {result['errors']}")
          PY

      - name: Commit dashboard slices (L348 retry)
        id: commit
        env:
          COMMIT_MESSAGE: "chore: human task observe-ack from dashboard [skip ci]"
          GHA_COMMIT_LABEL: human-task-ack
          GHA_COMMIT_REF: main
          GHA_COMMIT_OWNED: |
            docs/data/human_task_acks.json
            docs/data/human_tasks_board.json
            docs/data/daily_focus.json
            docs/data/daily_hub_history.json
          # Own board + hub slices fully — do not skip when generated_at races.
          # daily_focus must refresh so Daily open_task_count tracks durable acks.
          GHA_COMMIT_PRESERVE_NEWER_GENERATED_AT: "0"
        run: bash scripts/gha_commit_artifacts.sh

      - name: Mark dashboard commands done
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from value_investor.dashboard_bridge import complete_dashboard_commands

          ids = json.loads(Path("/tmp/human_task_ack_command_ids.json").read_text(encoding="utf-8"))
          if not ids:
              print("no command_ids to complete")
          else:
              result = complete_dashboard_commands(
                  ids,
                  status="done",
                  message="human-task-ack committed",
                  github_run_url=__import__("os").environ.get("GITHUB_RUN_URL"),
              )
              print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Mark dashboard commands failed
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from value_investor.dashboard_bridge import complete_dashboard_commands

          path = Path("/tmp/human_task_ack_command_ids.json")
          ids = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else []
          if ids:
              result = complete_dashboard_commands(
                  ids,
                  status="failed",
                  message="human-task-ack workflow failed",
                  github_run_url=__import__("os").environ.get("GITHUB_RUN_URL"),
              )
              print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Notify dashboard channel
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PY'
          from value_investor.dashboard_bridge import broadcast_dashboard_update
          broadcast_dashboard_update(
              event="artifact-updated",
              payload={"artifact": "human_tasks_board", "source": "human-task-ack"},
          )
          PY
