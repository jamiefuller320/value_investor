name: CI Main Nightly

# Full pytest on main regardless of paths-ignore / [skip ci] on docs/data commits.
# Catches latent test coupling to committed snapshots. Primary: cron-job.org daily
# workflow_dispatch; GitHub schedule is backup. See docs/ops/ci-fix-automation.md.
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main-nightly
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + test deps
        run: pip install -e ".[dev]"

      - name: Check committed data JSON integrity
        run: python3 scripts/check_committed_data_json.py

      - name: Ruff (changed Python since prior nightly)
        run: |
          BEFORE=$(git rev-list -n 2 HEAD | tail -1)
          python3 scripts/check_changed_python.py --base "${BEFORE}" --head HEAD

      - name: Pytest
        run: pytest -q
