name: Strategy book forward

# Weekday close refresh and forward walk, after the cash closes.
# Primary trigger is cron-job.org workflow_dispatch (scripts/import_cron_jobs.py
# keys strategy-book-forward-europe / strategy-book-forward). GitHub's schedule
# below is a backup only: it started the 21:30 slot 3.5-6 h late in Nov 2026.
# 17:45 UTC is after the London and continental closes (16:30 UTC winter,
# 15:30 summer). Yahoo publishes those bars soon after the close but drops them
# again overnight until the next session, so a run after ~23:00 UTC misses them.
# 21:30 UTC is after New York 16:00 (EST 21:00, EDT 20:00) and Toronto.
# Hong Kong 16:00 is 08:00 UTC, so both slots cover that session.
# Each run fetches only charts behind a market's latest completed session and
# trims bars after it, so a second or late run is a safe catch-up.
on:
  schedule:
    - cron: "45 17 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List due charts and forward counts without writing stores"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: strategy-book-forward
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: bash scripts/gha_pip_install.sh -e .

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh closes and walk the forward book
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            ftse-strategy-book-prices --repo-root .
            ftse-strategy-book-forward --repo-root .
          else
            ftse-strategy-book-prices --repo-root . --apply
            ftse-strategy-book-forward --repo-root . --apply
          fi

      # Report-only. A shadow failure must not stop the forward commit.
      # See docs/ops/strategy-book-memo-free-shadow.md.
      - name: Memo-free forward shadow
        continue-on-error: true
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            ftse-strategy-book-memo-free-shadow --repo-root .
          else
            ftse-strategy-book-memo-free-shadow --repo-root . --apply
          fi

      # Practice-account mirror only. Missing demo secrets plan rows and exit 0.
      # Never uses the live catalogue key. See docs/ops/strategy-book-demo-mirror.md.
      # A mirror failure must not stop the commit of the forward store and gate log.
      - name: Mirror primary orders on the Trading 212 demo account
        continue-on-error: true
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TRADING212_DEMO_API_KEY: ${{ secrets.TRADING212_DEMO_API_KEY }}
          TRADING212_DEMO_API_SECRET: ${{ secrets.TRADING212_DEMO_API_SECRET }}
        run: |
          set -euo pipefail
          args=(--repo-root .)
          if [ "${DRY_RUN}" != "true" ]; then
            args+=(--apply)
          fi
          if [ -n "${TRADING212_DEMO_API_KEY:-}" ] && [ -n "${TRADING212_DEMO_API_SECRET:-}" ]; then
            if [ "${DRY_RUN}" = "true" ]; then
              echo "Workflow dry run — demo placement skipped"
            else
              args+=(--place)
            fi
          else
            echo "Demo secrets absent — plan only, no orders"
          fi
          ftse-strategy-book-demo "${args[@]}"

      # Observe-only step 3.2 proof board. A failure here must not block the
      # forward commit. See docs/ops/strategy-book-proof.md.
      - name: Refresh the strategy book proof board
        continue-on-error: true
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            ftse-strategy-book-proof --repo-root . --no-write
          else
            ftse-strategy-book-proof --repo-root .
          fi

      # This workflow is the single writer for the strategy-book JSON stores.
      # Email-report excludes them. Charts stay shared with publish.
      - name: Commit strategy-book forward artifacts
        env:
          COMMIT_MESSAGE: "chore: strategy book forward [skip ci]"
          GHA_COMMIT_LABEL: "Strategy book forward"
          GHA_COMMIT_OWNED: |
            docs/data/strategy_book_observe.json
            docs/data/strategy_book_replay.json
            docs/data/strategy_book_replay_episodes.json.gz
            docs/data/strategy_book_gate_log.jsonl
            docs/data/strategy_book_closes.json
            docs/data/strategy_book_forward_status.json
            docs/data/strategy_book_demo_ledger.json
            docs/data/strategy_book_proof_board.json
            docs/data/strategy_book_memo_free_shadow.json
            docs/data/charts
        run: bash scripts/gha_commit_artifacts.sh
