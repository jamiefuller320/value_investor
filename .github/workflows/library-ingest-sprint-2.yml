name: Library ingest sprint 2 (parallel)

# Spare-capacity buy-tier filing deepen for the second parallel queue stream
# (e.g. asx200). An empty seated backlog still runs this slot. This stream does
# not take catalogue names. It ingests the buy queue: one buy, commit, next
# buy. An empty queue exits. The 2400s wait is for a real euro fetch or a real
# stream-1 index fetch. A stream-1 catalogue screen is not that wait. Hour
# skip is a local fallback only. Cadence: focus +60 min.
# A euro fetch or a stream-1 index fetch that is still going after the wait
# yields this slot (idle=false): ingest, the handoff loop, gap-closure
# follow-up, and the artifact push are skipped and the job succeeds. A
# stream-1 catalogue screen does not. Follow-up needs the loop JSON only the
# ingest step writes.
on:
  schedule:
    - cron: "15 8 * * 1-6"
    - cron: "15 11 * * 1-6"
    - cron: "15 14 * * *"
    - cron: "15 17 * * *"
  workflow_dispatch:
    inputs:
      markets:
        description: "Comma-separated market ids (empty = ingest_parallel_sprint_2 with gaps)"
        type: string
        default: ""
      max_targets:
        description: "Max buy-tier tickers per market"
        type: string
        default: "24"
      max_runtime_seconds:
        description: "Runtime budget per market (seconds)"
        type: string
        default: "2100"
      max_bodies:
        description: "Max bodies to refetch per ticker"
        type: string
        default: "20"
      force:
        description: "Accepted for older dispatch callers. The slot runs either way, including an empty backlog."
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: library-ingest-sprint-2
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: bash scripts/gha_pip_install.sh -e .

      - name: Evaluate parallel sprint 2 markets
        id: dispatch
        run: |
          set -euo pipefail
          ftse-library euro-ingest-dispatch --json --json-path /tmp/library_ingest_dispatch.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/library_ingest_dispatch.json").read_text())
          parallel = data.get("parallel_sprint_2_markets") or []
          needing = list(data.get("scheduler_stream_2_markets") or [])
          if not needing:
              needing = [
                  row.get("market_id")
                  for row in (data.get("parallel_sprint_2_status") or [])
                  if row.get("should_run_parallel_ingest")
              ]
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"parallel_markets={','.join(parallel)}\n"
              f"needing_sprint={','.join(needing)}\n",
              encoding="utf-8",
          )
          PY

      - name: Run spare slot even when the backlog is empty
        id: gate
        uses: actions/github-script@v8
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
          NEEDING: ${{ steps.dispatch.outputs.needing_sprint }}
        with:
          script: |
            const needing = (process.env.NEEDING || '').split(',').filter(Boolean);
            core.setOutput('should_run', 'true');
            if (process.env.FORCE === 'true') {
              core.info('force=true — running parallel library ingest sprint 2');
              return;
            }
            if (needing.length === 0) {
              core.info('Empty spare backlog — slot still runs so the catalogue handoff queue can be ingested');
              return;
            }
            core.info('Parallel sprint markets with filing gaps: ' + needing.join(','));

  library-ingest-sprint-2:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Note job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: bash scripts/gha_pip_install.sh -e .

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Wait for euro_depth and stream 1
        id: wait_head
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_WAIT_SECONDS: "2400"
          PREDECESSOR_WAIT_SCRIPT: scripts/wait_for_fetch_idle.sh
        run: |
          bash scripts/record_predecessor_idle.sh \
            "Euro or stream 1 still fetching after wait — skip spare stream 2" \
            euro-ingest-loop.yml library-ingest-sprint.yml

      - name: Refresh library state after predecessors finish
        if: steps.wait_head.outputs.idle == 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- docs/data/library

      - name: Run parallel library ingest sprint 2
        if: steps.wait_head.outputs.idle == 'true'
        env:
          MARKETS: ${{ github.event.inputs.markets }}
          MAX_TARGETS: ${{ github.event.inputs.max_targets }}
          MAX_RUNTIME_SECONDS: ${{ github.event.inputs.max_runtime_seconds }}
          MAX_BODIES: ${{ github.event.inputs.max_bodies }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          WORKFLOW_DISPATCH_PAT: ${{ secrets.WORKFLOW_DISPATCH_PAT }}
        run: |
          set -euo pipefail
          require_safe() {
            local name="$1" val="$2" re="$3"
            if [ -n "$val" ] && ! [[ "$val" =~ $re ]]; then
              echo "Rejecting unsafe dispatch input: $name" >&2
              exit 1
            fi
          }
          require_safe markets "${MARKETS:-}" '^[a-z0-9_,]+$'
          require_safe max_targets "${MAX_TARGETS:-}" '^[0-9]+$'
          require_safe max_runtime_seconds "${MAX_RUNTIME_SECONDS:-}" '^[0-9]+$'
          require_safe max_bodies "${MAX_BODIES:-}" '^[0-9]+$'
          RUNTIME="${MAX_RUNTIME_SECONDS:-}"
          if [ -z "$RUNTIME" ]; then
            RUNTIME="2100"
          fi
          TARGETS="${MAX_TARGETS:-24}"
          HUNT=(
            --lane sprint
            --budget "$RUNTIME"
            --stream 2
            --loop-json /tmp/library_ingest_sprint_2.json
            --commit-message "chore: library ingest sprint 2 (parallel) [skip ci]"
            --
            --head-idle
            --max-targets "$TARGETS"
            --max-runtime-seconds "$RUNTIME"
          )
          if [ -n "${MARKETS:-}" ]; then
            HUNT+=(--markets "$MARKETS")
          fi
          if [ -n "${MAX_BODIES:-}" ]; then
            HUNT+=(--max-bodies "$MAX_BODIES")
          fi
          bash scripts/ingest_hunt_commit.sh "${HUNT[@]}"

      - name: Evaluate library gap-closure follow-up
        id: gap_followup
        if: steps.wait_head.outputs.idle == 'true'
        run: |
          set -euo pipefail
          ftse-library ingest-gap-closure-followup \
            --loop-json /tmp/library_ingest_sprint_2.json \
            --json \
            --json-path /tmp/gap_followup.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("/tmp/gap_followup.json").read_text())
          out = Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(
              f"should_dispatch={'true' if data.get('should_dispatch') else 'false'}\n"
              f"gap_followup_reason={data.get('reason', '')}\n",
              encoding="utf-8",
          )
          PY

      - name: Dispatch library gap-closure follow-up after stall or slowdown
        if: steps.gap_followup.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/dispatch_library_gap_closure_followups.sh /tmp/gap_followup.json

      - name: Ingest catalogue handoffs
        if: steps.wait_head.outputs.idle == 'true'
        run: |
          set -euo pipefail
          # 6600s is the 110-minute job. Leave 300s so the commit can finish.
          bash scripts/ingest_hunt_commit.sh \
            --catalogue handoff \
            --job-seconds 6600 \
            --commit-reserve 300 \
            --commit-message "chore: catalogue explorer handoff ingest [skip ci]"

      - name: Commit and push library ingest artifacts
        if: steps.wait_head.outputs.idle == 'true'
        env:
          DISPATCH_PAGES: "true"
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/push_library_ingest_artifacts.sh \
            'chore: library ingest sprint 2 (parallel) [skip ci]'
