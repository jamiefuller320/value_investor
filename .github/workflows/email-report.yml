name: FTSE Email Report

# Reliable entrypoint: always run via workflow_dispatch (manual Actions UI,
# gh workflow run, or the companion schedule-trigger workflow).
# Do not attach cron here — GitHub schedule events at hour boundaries are
# best-effort and may be delayed or dropped.
on:
  workflow_dispatch:

# Only one report run at a time so dashboard commits cannot race on main.
concurrency:
  group: ftse-email-report
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  email-report:
    runs-on: ubuntu-latest
    # Explicit ceiling (GHA default is also 360). Saturday pre-Sunday ingest owns
    # OCR deepen; this job is screen/memo/send and should finish well under 6h.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system deps (CH accounts OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install package
        run: pip install -e .

      - name: Preflight checks
        env:
          CURSOR_API_KEY_V2: ${{ secrets.CURSOR_API_KEY_V2 }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY_V2 || secrets.CURSOR_API_KEY }}
          TICKER_API_KEY: ${{ secrets.TICKER_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: ftse-preflight --require-email

      - name: Screen, build reports, and publish dashboard
        env:
          CURSOR_API_KEY_V2: ${{ secrets.CURSOR_API_KEY_V2 }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY_V2 || secrets.CURSOR_API_KEY }}
          TICKER_API_KEY: ${{ secrets.TICKER_API_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          COMPANIES_HOUSE_OCR: "1"
          # Cap deepen OCR pages if any incidental CH fetch runs (default 48).
          COMPANIES_HOUSE_DEEPEN_OCR_MAX_PAGES: "16"
        run: |
          ARGS="--dry-run --publish-dashboard"
          if [ -n "$CURSOR_API_KEY" ]; then
            # Bodies are thickened on Saturday night by ingest-loop (pre-Sunday deepen
            # batches + drain). Do not re-run full buy-tier OCR deepen here — that
            # burned the 6h job (2026-09-20). Screen + memos + send only.
            # Optional mid-week Analysis refresh may still pass --ingest-improvement-pass
            # via accelerated-review email_only (docs/ops/accelerated-review-cycle.md);
            # that path should use --ingest-max-runtime-seconds (L429).
            ARGS="$ARGS --deep-analysis --research-docs --post-run-review --compile-engineering-tasks"
            # Phase B: essay gap-fill dropped from default Sunday bundle (structured
            # verdict slim). Optional: add --research-gap-fill for slim gap-fill.
          fi
          ftse-email $ARGS
          # Post-run clearance runs inside ftse-email when --post-run-review succeeds;
          # expose dispatch flag for the step below.
          if [ -f docs/data/post_run_clearance.json ]; then
            python3 <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("docs/data/post_run_clearance.json").read_text())
          last = data.get("last_run") or {}
          Path("post_run_clearance_dispatch.env").write_text(
              f"SHOULD_DISPATCH={'true' if last.get('should_dispatch_engineering') else 'false'}\n",
              encoding="utf-8",
          )
          print("post_run_clearance last_run recorded for dispatch step")
          PY
          fi

      - name: Send email report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: ftse-email --send-only

      # Fetch+reset overlay with push retry (L348). Avoids pull --rebase failing on
      # untracked research bodies and recovers from concurrent main writers.
      - name: Commit dashboard data
        id: dashboard_commit
        env:
          COMMIT_MESSAGE: "chore: update dashboard data [skip ci]"
          GHA_COMMIT_LABEL: "Email report"
          GHA_COMMIT_REF: ${{ github.ref_name }}
          # Includes docs/data/history/ run snapshots for backtest/sim replay.
          # Exclude ops-monitor owned status files — a broad docs/data overlay
          # otherwise rewrites a fresher ops_status.json from job checkout (L431).
          GHA_COMMIT_OWNED: |
            docs/data
            docs/research
            docs/data/engineering_tasks.json
            docs/data/post_run_clearance.json
            docs/data/so_what_closure.json
          GHA_COMMIT_EXCLUDE: |
            docs/data/ops_status.json
            docs/data/ops_monitor_log.json
        run: bash scripts/gha_commit_artifacts.sh

      - name: Dispatch engineering queue after post-run clearance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f post_run_clearance_dispatch.env ]; then
            # shellcheck disable=SC1091
            source post_run_clearance_dispatch.env
          else
            SHOULD_DISPATCH=false
          fi
          if [ "${SHOULD_DISPATCH}" = "true" ]; then
            gh workflow run engineering-queue.yml
            echo "Dispatched engineering-queue after post-run improvement clearance"
          else
            echo "Post-run clearance did not request engineering-queue dispatch"
          fi

      # [skip ci] on the commit above skips this workflow's push trigger for Pages;
      # dispatch pages.yml explicitly so jamiefuller320.github.io picks up latest.json.
      - name: Deploy dashboard to GitHub Pages
        if: steps.dashboard_commit.outputs.changes_detected == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              ref: 'main',
            });
            core.info('Dispatched pages.yml after dashboard data commit');
