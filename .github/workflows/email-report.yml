name: FTSE Email Report

# Reliable entrypoint: always run via workflow_dispatch (manual Actions UI,
# gh workflow run, or the companion schedule-trigger workflow).
# Do not attach cron here — GitHub schedule events at hour boundaries are
# best-effort and may be delayed or dropped.
on:
  workflow_dispatch:

# Only one report run at a time so dashboard commits cannot race on main.
concurrency:
  group: ftse-email-report
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  email-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system deps (CH accounts OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install package
        run: pip install -e .

      - name: Preflight checks
        env:
          CURSOR_API_KEY_V2: ${{ secrets.CURSOR_API_KEY_V2 }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY_V2 || secrets.CURSOR_API_KEY }}
          TICKER_API_KEY: ${{ secrets.TICKER_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: ftse-preflight --require-email

      - name: Screen, build reports, and publish dashboard
        env:
          CURSOR_API_KEY_V2: ${{ secrets.CURSOR_API_KEY_V2 }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY_V2 || secrets.CURSOR_API_KEY }}
          TICKER_API_KEY: ${{ secrets.TICKER_API_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          COMPANIES_HOUSE_OCR: "1"
        run: |
          ARGS="--dry-run --publish-dashboard"
          if [ -n "$CURSOR_API_KEY" ]; then
            # Ingest before research-docs/gap-fill so memos see thickened filing bodies
            # (email_agent also enforces this order and syncs docs/data → output/research).
            ARGS="$ARGS --deep-analysis --ingest-improvement-pass --ingest-improvement-cap 20 --research-docs --research-gap-fill --post-run-review --compile-engineering-tasks"
          fi
          ftse-email $ARGS

      - name: Send email report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: ftse-email --send-only

      # Rebase in case main moved (e.g. PR merge) during the long screen step.
      - name: Sync main before dashboard commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}"

      - name: Commit dashboard data
        id: dashboard_commit
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: update dashboard data [skip ci]"
          # Includes docs/data/history/ run snapshots for backtest/sim replay.
          file_pattern: docs/data/** docs/research/* docs/data/engineering_tasks.json
          skip_fetch: false

      # [skip ci] on the commit above skips this workflow's push trigger for Pages;
      # dispatch pages.yml explicitly so jamiefuller320.github.io picks up latest.json.
      - name: Deploy dashboard to GitHub Pages
        if: steps.dashboard_commit.outputs.changes_detected == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              ref: 'main',
            });
            core.info('Dispatched pages.yml after dashboard data commit');
