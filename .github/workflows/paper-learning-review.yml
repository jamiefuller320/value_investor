name: FTSE Paper Learning Review

# Optional observe-only churn/cost synthesis for paper learning tracks.
# Disable via docs/data/paper_automation/review_policy.json before live capital.
on:
  schedule:
    - cron: "45 10 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if paper learning review already succeeded today"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: ftse-paper-learning-review
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Skip if paper learning review already ran today
        id: gate
        uses: actions/github-script@v8
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        with:
          script: |
            const force = process.env.FORCE === 'true';
            if (force) {
              core.setOutput('should_run', 'true');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'paper-learning-review.yml';
            const runId = context.runId;
            const dayStart = new Date(Date.UTC(
              new Date().getUTCFullYear(),
              new Date().getUTCMonth(),
              new Date().getUTCDate(),
            )).toISOString();
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id, per_page: 20,
            });
            const prior = (data.workflow_runs || []).filter((r) =>
              r.id !== runId
              && r.created_at >= dayStart
              && (r.event === 'workflow_dispatch' || r.event === 'schedule')
            );
            const succeeded = prior.find((r) => r.conclusion === 'success');
            if (succeeded) {
              core.info(`Skipping — paper learning review already succeeded today (run ${succeeded.id})`);
              core.setOutput('should_run', 'false');
              return;
            }
            core.setOutput('should_run', 'true');

  paper-learning-review:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Check enable flag and inputs
        id: ready
        run: |
          set +e
          ftse-paper-learning-review status --json > /tmp/plr_status.json
          cat /tmp/plr_status.json
          enabled=$(python3 - <<'PY'
          import json
          print('true' if json.load(open('/tmp/plr_status.json')).get('enabled') else 'false')
          PY
          )
          if [ "$enabled" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Paper learning review disabled — skipping agent run"
            exit 0
          fi
          ftse-paper-learning-review payload --json > /tmp/plr_payload.json
          code=$?
          cat /tmp/plr_payload.json
          if [ "$code" -ne 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Paper learning inputs not ready — skipping agent run"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Run paper learning review
        if: steps.ready.outputs.skip != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: ftse-paper-learning-review run --json

      - name: Sync main before commit
        if: steps.ready.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main

      - name: Commit paper learning review artifacts
        if: steps.ready.outputs.skip != 'true'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: paper learning churn review [skip ci]"
          file_pattern: |
            docs/data/paper_learning_review.json
            docs/data/paper_learning_review.md
            docs/data/paper_learning_tasks.json
          skip_fetch: false
