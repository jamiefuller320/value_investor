[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "value-investor"
version = "0.1.0"
description = "FTSE 100 value investment screener with Cursor SDK agent analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cursor-sdk>=0.1.0",
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "lxml>=5.0",
    "html5lib>=1.1",
    "pypdf>=4.0",
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "pre-commit>=3.0"]

[project.scripts]
ftse-screen = "value_investor.cli:main"
ftse-email = "value_investor.email_agent:main"
ftse-research = "value_investor.research_cli:main"
ftse-research-backfill = "value_investor.research.memo_backfill_cli:main"
ftse-publish = "value_investor.publish_cli:main"
ftse-simulate = "value_investor.simulator_cli:main"
ftse-historical = "value_investor.historical_analysis_cli:main"
ftse-preflight = "value_investor.preflight_cli:main"
ftse-verify-key = "value_investor.verify_key_cli:main"
ftse-paper-auto = "value_investor.paper_automation_cli:main"
ftse-decision-review = "value_investor.decision_review_cli:main"
ftse-rebalance-log = "value_investor.rebalance_log_cli:main"
ftse-knob-calibrate = "value_investor.knob_calibration_cli:main"
ftse-archive-history = "value_investor.archive_history_cli:main"
ftse-exit-timing-archive = "value_investor.exit_timing_archive_cli:main"
ftse-exclusion-universe-archive = "value_investor.exclusion_universe_archive_cli:main"
ftse-loser-snapshot-cards = "value_investor.loser_snapshot_cards_cli:main"
ftse-trajectory-evidence = "value_investor.trajectory_evidence_cli:main"
ftse-exclusion-ladder-replay = "value_investor.exclusion_ladder_replay_cli:main"
ftse-index-stress-archive = "value_investor.index_stress_archive_cli:main"
ftse-defer = "value_investor.deferred_ideas_cli:main"
ftse-library = "value_investor.data_library_cli:main"
ftse-engineering = "value_investor.engineering_cli:main"
ftse-ingest-loop = "value_investor.ingest_loop_cli:main"
ftse-ingest-audit = "value_investor.ingest_utilization_audit_cli:main"
ftse-analysis-review = "value_investor.analysis_review_cli:main"
ftse-horizon-scan = "value_investor.horizon_scan_cli:main"
ftse-paper-learning-review = "value_investor.paper_learning_review_cli:main"
ftse-learning-director = "value_investor.learning_director_cli:main"
ftse-experiment-assess = "value_investor.experiment_assessment_cli:main"
ftse-ops-monitor = "value_investor.ops_monitor_cli:main"
ftse-backtest-health = "value_investor.backtest_health_cli:main"
ftse-data-backup = "value_investor.data_backup_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
]
ignore = [
    "E501",  # line length — formatter
    "B008",  # call in default — common in CLIs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]  # useless attribute access in tests is fine
